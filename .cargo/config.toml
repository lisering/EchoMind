# EchoMind 项目级 Cargo 配置
# 解决 Free/Pro 双 feature 编译产物堆积问题

# ──────────────────────────────────────────────
# [alias] 项目级命令别名
# Free 和 Pro 使用独立 target 目录，避免产物交叉堆积
# ──────────────────────────────────────────────
[alias]
# Pro 构建（默认，开发者通常使用 Pro）
b-pro = "build --features pro"
br-pro = "build --release --features pro"
t-pro = "test --features pro"
r-pro = "run --features pro"

# Free 构建（仅测试 Free 功能时使用）
b-free = "build"
br-free = "build --release"
t-free = "test"
r-free = "run"

# ──────────────────────────────────────────────
# [build] 编译优化
# ──────────────────────────────────────────────
# 注：split-debuginfo 已移除——cargo 1.9x 起该 key 在项目级 config 中
# 报 "unused config key" warning（仅 [profile] 表支持），macOS 默认行为已足够。

# EchoMind CI — 统一流水线（v2.0 S08）
#
# S07: 合并原 build.yml + e2e.yml，消除 fmt/clippy/test 职责重叠。
# S08: 增强 — 新增 frontend-checks + release-build（安装包产出）+ CI 优化。
#
# Job 依赖图：
#   lint ──────────┐
#   frontend-checks ─┤
#   supply-chain ────┤ (独立并行)
#                     ↓
#                    test ────────┐
#                                 ↓
#                          build-matrix ────────┐
#                                             ↓
#                                         e2e-gui
#                    test ──→ e2e-bridge ──→ e2e-bridge-report
#   push to main → build-matrix ──→ release-build (安装包)
#
# 触发：push to main + PR + 每日定时（18:00 UTC）+ 手动
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# 同名 workflow 跑到一半时，新 push 自动取消旧 run，节省 CI 额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # 1. lint — fmt + clippy（Free + Pro），快速失败
  # ==================================================================
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: lint

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format check (cargo fmt --check)
        run: cargo fmt --check

      - name: Clippy (Free, deny lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (Pro, deny lint)
        run: cargo clippy --all-targets --features pro -- -D warnings

  # ==================================================================
  # 2. frontend-checks — tsc + esbuild + Vitest（独立并行，快速失败）
  # ==================================================================
  frontend-checks:
    name: Frontend Checks (tsc + esbuild + vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install root dependencies (esbuild/typescript)
        run: npm ci

      - name: Build UI (esbuild IIFE bundle)
        run: node scripts/build-ui.mjs

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Install E2E dependencies (for Vitest)
        working-directory: e2e-tests
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: e2e-tests
        run: npm run test:unit

  # ==================================================================
  # 3. supply-chain — cargo-audit + cargo-deny（独立并行）
  # ==================================================================
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: supply-chain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (RustSec vulnerability scan)
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny (license + source + bans check)
        run: cargo deny check

  # ==================================================================
  # 4. test — cargo test（Free + Pro）+ chaos tests
  # 依赖 lint + frontend-checks（避免已知失败浪费时间）
  # ==================================================================
  test:
    name: Test (Free + Pro + chaos)
    runs-on: ubuntu-24.04
    needs: [lint, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: test

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache embedding model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: target/fastembed-cache
          key: fastembed-model-v1-test

      - name: Run all tests (Free)
        run: cargo test --workspace

      - name: Run all tests (Pro)
        run: cargo test --workspace --features pro

      - name: Generate chaos test corpus
        run: python3 tests/fixtures/generate_corpus.py

      - name: Run chaos tests (include ignored)
        run: cargo test --workspace -- --nocapture --include-ignored

  # ==================================================================
  # 5. build-matrix — 跨平台 release build（4 OS）
  # 依赖 test 通过（避免已知失败的平台编译浪费时间）
  # Free + Pro 顺序构建（Pro 增量编译，快速）
  # ==================================================================
  build-matrix:
    name: Build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Windows-x64 暂缓：bundled-sqlcipher 需 Windows OpenSSL 工具链
        # （链接 libcrypto.lib 失败），独立任务跟进后恢复。
        include:
          - os: macos-latest    # arm64 (Apple Silicon)
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: ubuntu-24.04    # x64
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: build-${{ matrix.label }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install OpenSSL (Windows, for bundled-sqlcipher)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install openssl -y --no-progress
          # 探测实际安装路径（choco 版本不同路径不同）
          FOUND=""
          for d in "/c/Program Files/OpenSSL-Win64" "/c/Program Files/OpenSSL"                    "/c/Program Files (x86)/OpenSSL-Win64" "/c/Program Files (x86)/OpenSSL"; do
            if [ -d "$d/include" ] && [ -d "$d/lib" ]; then FOUND="$d"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::OpenSSL 安装后未找到 include/lib 目录"
            ls "/c/Program Files" 2>/dev/null || true
            exit 1
          fi
          # 转为 Windows 路径格式（libsqlite3-sys build.rs 需要）
          WIN_PATH=$(echo "$FOUND" | sed 's|^/c/|C:/|')
          echo "OPENSSL_DIR=$WIN_PATH" >> $GITHUB_ENV
          echo "OpenSSL 目录: $WIN_PATH"

      - name: Cache embedding model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: target/fastembed-cache
          key: fastembed-model-v1-${{ matrix.label }}

      # ─── Free release build ───
      - name: Build (Free, release)
        run: cargo build --release --target ${{ matrix.target }}

      # ─── Pro release build（增量编译，Pro 是 Free 超集）───
      - name: Build (Pro, release)
        run: cargo build --release --features pro --target ${{ matrix.target }}

  # ==================================================================
  # 6. release-build — Tauri 安装包构建（.dmg/.msi/.deb/.AppImage）
  # 仅 push to main 时触发（PR 不构建安装包，节省 CI 时间）
  # 依赖 build-matrix（确保编译成功后再构建安装包）
  # ==================================================================
  release-build:
    name: Release Build (${{ matrix.label }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # arm64 (Apple Silicon)
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: ubuntu-24.04    # x64
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: release-${{ matrix.label }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install OpenSSL (Windows, for openssl-sys)
        if: runner.os == 'Windows'
        run: |
          choco install openssl -y --no-progress
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Build UI (esbuild IIFE bundle)
        run: node scripts/build-ui.mjs

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      # ─── macOS: Import signing certificate (if secrets available) ───
      - name: Import macOS signing certificate
        # HAS_SIGNING_CERT 由 job 级 env 中转（step if 不允许直接引用 secrets 上下文）
        if: runner.os == 'macOS' && env.HAS_SIGNING_CERT == 'true'
        env:
          HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE_P12 != '' }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_NAME="echomind-build-$(date +%s).keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security import /tmp/certificate.p12 -k "$KEYCHAIN_NAME" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tools: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          echo "APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -oE 'Developer ID Application.*' | head -1)" >> $GITHUB_ENV
          rm -f /tmp/certificate.p12

      - name: Build Tauri installers (Pro)
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Skip codesign if no signing identity is set
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing identity — building without codesign"
            # Tauri reads tauri.conf.json; no signingIdentity = no codesign attempt
            # But env var empty string triggers codesign with empty identity, so unset it
            unset APPLE_SIGNING_IDENTITY
          fi
          cargo tauri build --features pro --target ${{ matrix.target }}

      - name: Upload installers (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: EchoMind-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: EchoMind-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload installers (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: EchoMind-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30

  # ==================================================================
  # 7. e2e-bridge — Playwright bridge 测试（分片，ubuntu + macos）
  # 依赖 test + frontend-checks 通过
  # ==================================================================
  e2e-bridge:
    name: E2E Bridge (shard ${{ matrix.shardIndex }}/4, ${{ matrix.os }})
    needs: [test, frontend-checks]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      - name: Run E2E bridge tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: e2e-tests
        env:
          E2E_SPEED: '0.2'
          PLAYWRIGHT_RETRIES: '1'
          CI_E2E_SKIP_UNSTABLE: '1'
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.os }}-${{ matrix.shardIndex }}
          path: e2e-tests/blob-report/*
          include-hidden-files: true
          retention-days: 1

  # 合并分片报告
  e2e-bridge-report:
    name: E2E Bridge Report
    if: ${{ !cancelled() }}
    needs: [e2e-bridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: e2e-tests/blob-report
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        working-directory: e2e-tests
        run: |
          if [ ! -d blob-report ] || [ -z "$(ls -A blob-report 2>/dev/null)" ]; then
            echo "::warning::无 blob-report 输入（上游 e2e-bridge 全部跳过/失败），跳过合并"
            exit 0
          fi
          npx playwright merge-reports --reporter=html blob-report

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bridge-html-report
          path: e2e-tests/playwright-report
          retention-days: 7

  # ==================================================================
  # 8. e2e-gui — 真实 GUI 测试（WebdriverIO + tauri-driver）
  # 仅 ubuntu + windows（macOS 不支持 tauri-driver）
  # 依赖 build-matrix 通过
  # ==================================================================
  e2e-gui:
    name: E2E GUI (${{ matrix.os }})
    # V3.1 阶段二：真实 GUI 层（wdio specs 为历史遗留冒烟，待现代化）。
    # 不阻塞主干——失败仅告警，结果在 Actions 页单独归因。
    continue-on-error: true
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-gui

      - name: Cache embedding model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: target/fastembed-cache
          key: fastembed-model-v1-gui

      - name: Install WebKitGTK WebDriver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install OpenSSL (Windows, for bundled-sqlcipher)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install openssl -y --no-progress
          FOUND=""
          for d in "/c/Program Files/OpenSSL-Win64" "/c/Program Files/OpenSSL" \
                   "/c/Program Files (x86)/OpenSSL-Win64" "/c/Program Files (x86)/OpenSSL"; do
            if [ -d "$d/include" ] && [ -d "$d/lib" ]; then FOUND="$d"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::OpenSSL 安装后未找到 include/lib 目录"
            exit 1
          fi
          WIN_PATH=$(echo "$FOUND" | sed 's|^/c/|C:/|')
          echo "OPENSSL_DIR=$WIN_PATH" >> $GITHUB_ENV

      - name: Build application
        run: cargo build --workspace

      - name: Install E2E dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Run L3 real GUI E2E (Linux, xvfb)
        if: runner.os == 'Linux'
        working-directory: e2e-tests
        run: xvfb-run -a npm run test:e2e

      - name: Run L3 real GUI E2E (Windows)
        if: runner.os == 'Windows'
        working-directory: e2e-tests
        run: npm run test:e2e

# CI — Build, Lint, Test (Free + Pro)
# Triggers: PR + push to main + daily schedule
# Matrix: macOS (arm64 + x64), Windows x64, Linux x64
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.label }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format check
        run: cargo fmt --check

      - name: Build (Free, release)
        run: cargo build --release

      - name: Clippy (Free, deny lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (Free)
        run: cargo test

      - name: Build (Pro, release)
        run: cargo build --release --features pro

      - name: Clippy (Pro, deny lint)
        run: cargo clippy --all-targets --features pro -- -D warnings

      - name: Test (Pro)
        run: cargo test --features pro

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Security audit (RustSec)
        run: cargo audit

      - name: License & source check
        run: cargo deny check

# CI 三平台构建矩阵（REQ-NFR-017）：
# 在 macOS（arm64 + x64）、Windows x64、Linux x64 上执行完整构建验证：
# fmt 检查 + clippy（Free + Pro）+ 单元测试（Free + Pro）+ release 编译
# 与 e2e.yml 互补：e2e.yml 侧重 E2E 测试 + 安装包产出，build.yml 侧重跨平台编译验证
name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

jobs:
  build-matrix:
    name: Build & Test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # arm64 (Apple Silicon)
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-13        # x64 (Intel)
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest  # x64
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04    # x64
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.label }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ─── 格式检查 ───
      - name: Format check (cargo fmt --check)
        run: cargo fmt --check

      # ─── Free 版本 ───
      - name: Build (Free, release)
        run: cargo build --release

      - name: Clippy (Free, deny lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (Free)
        run: cargo test

      # ─── Pro 版本 ───
      - name: Build (Pro, release)
        run: cargo build --release --features pro

      - name: Clippy (Pro, deny lint)
        run: cargo clippy --all-targets --features pro -- -D warnings

      - name: Test (Pro)
        run: cargo test --features pro

      # ─── 缓存嵌入模型（加速 Pro 测试中的 ONNX 推理）───
      - name: Cache embedding model (all-MiniLM-L6-v2)
        uses: actions/cache@v4
        with:
          path: target/fastembed-cache
          key: fastembed-model-v1-${{ matrix.label }}

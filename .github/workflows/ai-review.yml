# AI Code Review — Claude Code Action
# Uses Claude (Anthropic) to review pull requests automatically.
#
# Setup:
#   1. Get an Anthropic API key from https://console.anthropic.com/
#   2. Add it as a GitHub repository secret: ANTHROPIC_API_KEY
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Every PR will be automatically reviewed by Claude

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for:
            1. Security — injection, unsafe code, secrets in code, PII leaks
            2. Rust best practices — no unwrap/expect/panic, proper error handling
            3. Architecture — hexagonal dependency direction (models ← core ← infra ← tauri-app)
            4. Performance — blocking I/O in async, unnecessary allocations
            5. BUSL-1.1 compliance — no removal of Ed25519 license verification
            Provide concise, actionable feedback. Approve if clean.
          max_comments: 20

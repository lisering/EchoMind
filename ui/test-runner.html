<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>EchoMind Test Runner</title>
</head>
<body>
<div id="app-container"></div>
<script src="http://127.0.0.1:18901/e2e-tests/tests/bridge/tauri-stub.js"></script>
<script>
window.addEventListener('load', function() {
  // Use fetch to get the index.html content and inject it
  fetch('http://127.0.0.1:18901/ui/index.html')
    .then(r => r.text())
    .then(html => {
      // Parse the HTML
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      
      // Copy head content
      doc.head.querySelectorAll('script').forEach(s => {
        if (s.src) {
          const newScript = document.createElement('script');
          newScript.src = 'http://127.0.0.1:18901/ui/' + s.getAttribute('src');
          document.head.appendChild(newScript);
        } else {
          const newScript = document.createElement('script');
          newScript.textContent = s.textContent;
          document.head.appendChild(newScript);
        }
      });
      doc.head.querySelectorAll('link,style').forEach(s => {
        document.head.appendChild(s.cloneNode(true));
      });
      
      // Copy body content
      document.body.innerHTML = doc.body.innerHTML;
      
      // Now re-execute the inline scripts in body
      document.body.querySelectorAll('script').forEach(s => {
        if (s.src) {
          const newScript = document.createElement('script');
          newScript.src = 'http://127.0.0.1:18901/ui/' + s.getAttribute('src');
          document.body.appendChild(newScript);
        } else {
          const newScript = document.createElement('script');
          newScript.textContent = s.textContent;
          document.body.appendChild(newScript);
        }
      });
    });
});
</script>
</body>
</html>

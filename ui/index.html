<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMind</title>
    <!-- 前端库全部本地化（PROJECT_RULES 体系三 / REQ-SEC-003：禁止运行时 CDN） -->
    <script src="vendor/tailwindcss.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // === Design Token v2.0 — 暗色主题（FIGMA_DESIGN_SPEC §2.1） ===
              'surface-0': '#0A0A0B',
              'surface-1': '#131316',
              'surface-2': '#1C1C20',
              'surface-3': '#26262C',
              'surface-4': '#303036',
              base: '#0A0A0B',
              panel: '#131316',
              line: '#2A2A2E',
              'border-subtle': '#1F1F23',
              'border-default': '#2A2A2E',
              'border-strong': '#3A3A40',
              'text-primary': '#F8FAFC',
              'text-secondary': '#CBD5E1',
              'text-tertiary': '#94A3B8',
              'text-quaternary': '#64748B',
              accent: '#38BDF8',
              'accent-hover': '#0EA5E9',
              ink: '#0C1116',
              muted: '#94A3B8',
              success: '#4ADE80',
              warning: '#FBBF24',
              danger: '#F87171',
              info: '#60A5FA',
            },
            fontFamily: {
              sans: ['-apple-system', '"SF Pro SC"', '"PingFang SC"', '"Segoe UI"', 'sans-serif'],
              mono: ['"SF Mono"', '"JetBrains Mono"', '"Fira Code"', 'monospace'],
            },
            borderRadius: {
              'xs': '4px', 'sm': '8px', 'md': '12px', 'lg': '16px', 'xl': '20px', '2xl': '24px',
            },
            transitionDuration: {
              'micro': '100ms', 'fast': '150ms', 'normal': '250ms', 'smooth': '400ms',
            },
            boxShadow: {
              'float': '0 4px 12px rgba(0,0,0,0.15)',
              'pop': '0 8px 24px rgba(0,0,0,0.2)',
              'modal': '0 16px 48px rgba(0,0,0,0.25)',
              'glow': '0 0 0 3px rgba(56,189,248,0.25)',
            },
          },
        },
      };
    </script>
    <!-- 第三方库本地化 -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="vendor/katex/katex.min.js"></script>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <script src="vendor/katex/katex-mhchem.min.js"></script>
    <script src="vendor/chart.umd.min.js"></script>
    <link rel="stylesheet" href="vendor/github-dark.min.css" />
    <!-- ============ EchoMind 样式（模块化拆分 / FIGMA_DESIGN_SPEC §2-§10） ============ -->
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/typography.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body class="bg-base text-slate-200 overflow-hidden">
    <!-- ============ 首次启动配置向导（REQ-UI-007） ============ -->
    <div id="wizard" class="fixed inset-0 z-40 bg-base overflow-y-auto">
      <div class="min-h-full flex items-center justify-center">
      <div class="w-full max-w-xl px-8 py-8 fade-in">
        <div class="mb-8 text-center">
          <img src="logo.png" alt="EchoMind" class="w-16 h-16 mx-auto mb-3" />
          <div class="text-2xl font-semibold tracking-wide">EchoMind</div>
          <p class="mt-3 text-sm text-slate-400" data-i18n="wizard.welcome"></p>
          <p class="mt-1 text-xs text-slate-500" data-i18n="wizard.first_time_hint"></p>
        </div>
        <div id="presetCards" class="grid grid-cols-3 gap-3 mb-6"></div>
        <div class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1.5" data-i18n="wizard.api_key">API Key</label> <span id="keyOptional" class="hidden text-accent" data-i18n="wizard.api_key_optional"></span>
            <input id="wizKey" type="password" placeholder="sk-..." autocomplete="off"
              class="w-full bg-panel border border-line rounded-xl px-4 py-3 text-sm outline-none focus:border-accent transition-colors" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1.5" data-i18n="wizard.base_url">Base URL</label>
              <input id="wizUrl" type="text" aria-label="Base URL"
                class="w-full bg-panel border border-line rounded-xl px-4 py-3 text-sm outline-none focus:border-accent transition-colors" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1.5" data-i18n="wizard.model">Model</label>
              <input id="wizModel" type="text" aria-label="Model"
                class="w-full bg-panel border border-line rounded-xl px-4 py-3 text-sm outline-none focus:border-accent transition-colors" />
            </div>
          </div>
        </div>
        <div id="wizError" class="hidden mt-4 text-sm text-red-400 bg-red-400/10 border border-red-400/30 rounded-xl px-4 py-3"></div>
        <div class="mt-6 flex items-center justify-between">
          <button id="wizKeyLink" class="text-sm text-accent hover:underline" data-i18n="wizard.get_api_key"></button>
          <button id="wizStart" class="bg-accent font-medium text-sm rounded-xl px-6 py-3 hover:opacity-90 transition-opacity disabled:opacity-40 text-ink" data-i18n="wizard.start"></button>
        </div>
      </div>
      </div>
    </div>

    <!-- ============ 主界面（REQ-UI-001/002/003） ============ -->
    <div id="app" class="hidden h-full flex flex-col">
      <!-- 顶部工具栏（h-7=28px 匹配 macOS 标题栏；全屏时 .topbar-fs 类自动收缩 padding-left） -->
      <div id="topBar" data-tauri-drag-region class="shrink-0 h-7 flex items-center gap-1 px-2 border-b border-border-subtle bg-surface-1">
        <!-- 知识库图标 -->
        <button id="kbBtn" data-i18n-title="sidebar.knowledge_base" data-i18n-aria-label="sidebar.knowledge_base" class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md text-slate-400 hover:text-accent hover:bg-accent/10 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <!-- 搜索会话图标 -->
        <button id="convSearchBtn" data-i18n-title="sidebar.search_conversations" data-i18n-aria-label="sidebar.search_conversations" class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md text-slate-400 hover:text-accent hover:bg-accent/10 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <!-- 设置图标 -->
        <button id="settingsBtn" data-i18n-title="sidebar.settings" data-i18n-aria-label="sidebar.settings" class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md text-slate-400 hover:text-accent hover:bg-accent/10 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <!-- 展开按钮（折叠时显示） -->
        <button id="expandBtn" data-i18n-title="sidebar.expand" data-i18n-aria-label="sidebar.expand" class="hidden shrink-0 w-6 h-6 flex items-center justify-center rounded-md text-slate-400 hover:text-accent hover:bg-accent/10 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <!-- 折叠按钮（展开时显示） -->
        <button id="collapseBtn" data-i18n-title="sidebar.collapse" data-i18n-aria-label="sidebar.collapse" class="shrink-0 w-6 h-6 flex items-center justify-center rounded-md text-slate-400 hover:text-accent hover:bg-accent/10 transition-colors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <!-- 内容区域 -->
      <div class="flex-1 flex min-h-0">
        <!-- 左侧侧栏（会话历史） -->
        <aside id="sidebar" class="w-60 shrink-0 bg-surface-1 border-r border-border-subtle flex flex-col transition-all duration-normal overflow-hidden">
          <!-- 品牌标识 -->
          <div class="px-3 py-3 flex items-center gap-2">
            <img src="logo.png" alt="EchoMind" class="w-6 h-6 shrink-0 side-label" />
            <span class="font-semibold tracking-wide text-text-primary" data-i18n="sidebar.brand">EchoMind</span>
          </div>
          <!-- 新对话 -->
          <div class="px-3 pb-2">
            <button id="newChatBtn" class="w-full text-sm bg-accent/10 text-accent border border-accent/30 rounded-lg px-3 py-2 hover:bg-accent/20 transition-colors flex items-center gap-2 justify-center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span data-i18n="sidebar.new_chat">New Chat</span>
            </button>
          </div>
          <!-- 会话列表（支持滚动加载+时间分组+sticky日期头） -->
          <div id="convList" class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-2"></div>
          <!-- Pro 状态 + 隐私指示器 -->
          <div class="mt-auto px-3 py-2.5 border-t border-border-subtle">
            <div class="flex items-center justify-between gap-2">
              <span id="proStatusBadge" class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-medium bg-surface-3 text-text-tertiary border border-border-default">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span id="proStatus">Free</span>
              </span>
              <span class="inline-flex items-center gap-1 text-[10px] text-text-quaternary" data-i18n="sidebar.data_local" data-i18n-title="sidebar.data_local_tooltip">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span data-i18n="sidebar.data_local">Local</span>
              </span>
            </div>
          </div>
        </aside>

      <!-- 右侧主区域 -->
      <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div class="flex-1 min-h-0 relative">
          <div id="chatArea" class="h-full overflow-y-auto scrollbar-thin px-6 py-6"></div>
          <div id="convNav" class="conv-nav"></div>
        </div>

        <!-- 导入进度条（REQ-ING-006） -->
        <div id="importProgress" class="hidden shrink-0 px-6 pb-1">
          <div class="bg-panel border border-line rounded-xl px-4 py-2.5">
            <div class="flex items-center justify-between mb-1.5">
              <span id="importProgressText" class="text-xs text-slate-300"></span>
              <button id="importCancelBtn" class="text-[11px] text-red-400 hover:text-red-300 border border-red-400/40 rounded px-2 py-0.5 transition-colors" data-i18n="import.cancel_import">Cancel Import</button>
            </div>
            <div class="w-full bg-base rounded-full h-1 overflow-hidden">
              <div id="importProgressBar" class="bg-accent h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- 底部控制台式输入框（REQ-UI-003） -->
        <div class="shrink-0 px-6 pb-5 pt-2">
          <div id="inputBar" class="bg-panel border border-line rounded-2xl px-4 py-3 flex items-end gap-3 transition-colors focus-within:border-accent/60">
            <button id="plusBtn" data-i18n-title="chat.import_files" class="shrink-0 w-9 h-9 flex items-center justify-center rounded-xl bg-white/5 text-slate-300 hover:text-accent hover:bg-accent/10 transition-colors">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </button>
            <textarea id="queryInput" rows="1" data-i18n-placeholder="chat.input_placeholder" aria-label="query input"
              class="flex-1 bg-transparent resize-none outline-none text-sm leading-6 max-h-40 scrollbar-thin py-1.5 self-center"></textarea>
            <button id="sendBtn" class="shrink-0 h-9 px-4 rounded-xl bg-accent text-sm font-medium hover:opacity-90 transition-opacity disabled:opacity-30 disabled:cursor-not-allowed text-ink flex items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              <span data-i18n="chat.send">Send</span>
            </button>
            <button id="stopBtn" data-i18n-title="chat.stop_generation" class="hidden shrink-0 h-9 px-4 rounded-xl bg-red-500/15 text-red-300 border border-red-400/40 text-sm hover:bg-red-500/25 transition-colors flex items-center gap-1.5">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              <span data-i18n="chat.stop">Stop</span>
            </button>
          </div>
          <div id="inputHint" class="mt-2 px-1 text-[11px] text-slate-500 h-4"></div>
        </div>
      </main>
    </div>

    <!-- ============ 拖拽全屏遮罩（REQ-UI-004） ============ -->
    <div id="dragOverlay" class="hidden fixed inset-0 z-50 bg-base/90 backdrop-blur-sm flex items-center justify-center pointer-events-none">
      <div class="border-2 border-dashed border-accent rounded-3xl w-[86%] h-[80%] flex flex-col items-center justify-center fade-in">
        <div class="text-5xl text-accent mb-4 flex justify-center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
        <div class="text-xl font-medium text-accent" data-i18n="import.drag_title"></div>
        <p class="mt-2 text-sm text-slate-400" data-i18n="import.drag_hint"></p>
      </div>
    </div>

    <!-- ============ 会话搜索弹框 ============ -->
    <div id="convSearchPopup" class="hidden fixed inset-0 z-[75] bg-surface-0/60 backdrop-blur-sm flex items-start justify-center pt-[15vh]" role="dialog" aria-modal="true" aria-label="sidebar.search_conversations">
      <div class="w-full max-w-[480px] bg-surface-1 border border-border-strong rounded-lg shadow-modal scale-in overflow-hidden flex flex-col" style="max-height: 70vh">
        <div class="flex items-center gap-3 px-4 h-12 border-b border-border-subtle shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-text-quaternary shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="convSearchPopupInput" type="text" data-i18n-placeholder="sidebar.search_conversations" autocomplete="off" class="flex-1 bg-transparent outline-none text-sm text-text-primary placeholder:text-text-quaternary" />
          <kbd class="text-[11px] text-text-quaternary bg-surface-3 px-1.5 rounded-xs shrink-0">Esc</kbd>
          <button id="convSearchClose" class="modal-close-btn shrink-0" data-i18n-title="common.close" data-i18n-aria-label="common.close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="convSearchResults" role="listbox" class="flex-1 overflow-y-auto scrollbar-thin py-1.5"></div>
      </div>
    </div>

    <!-- ============ 命令面板（FIGMA_DESIGN_SPEC §7 / REQ-KB-002） ============ -->
    <div id="commandPalette" class="hidden fixed inset-0 z-[80] bg-surface-0/60 backdrop-blur-sm flex items-start justify-center pt-[15vh]">
      <div class="w-full max-w-[560px] bg-surface-1 border border-border-strong rounded-lg shadow-modal scale-in overflow-hidden flex flex-col" style="max-height: 70vh" role="dialog" aria-modal="true" aria-label="Command Palette">
        <div class="flex items-center gap-3 px-4 h-12 border-b border-border-subtle shrink-0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-text-quaternary shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="cmdSearch" type="text" data-i18n-placeholder="command_palette.placeholder" autocomplete="off"
            class="flex-1 bg-transparent outline-none text-sm text-text-primary placeholder:text-text-quaternary" role="combobox" aria-expanded="true" aria-controls="cmdList" />
          <kbd class="text-[11px] text-text-quaternary bg-surface-3 px-1.5 rounded-xs shrink-0">Esc</kbd>
          <button id="cmdPaletteClose" class="modal-close-btn shrink-0" data-i18n-title="common.close" data-i18n-aria-label="common.close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div id="cmdList" role="listbox" class="flex-1 overflow-y-auto scrollbar-thin py-1.5"></div>
      </div>
    </div>

    <!-- Toast 通道（REQ-UI-005 前置） -->
    <div id="toasts" class="fixed bottom-6 right-6 z-[60] flex flex-col gap-2 w-80" aria-live="polite"></div>

    <!-- ============ 付费墙 Modal（REQ-LIC-003） ============ -->
    <div id="paywall" class="hidden fixed inset-0 z-50 bg-surface-0/60 backdrop-blur-sm flex items-start justify-center pt-[15vh]" role="dialog" aria-modal="true" aria-label="paywall.title">
      <div class="w-full max-w-md bg-surface-1 border border-border-strong rounded-lg shadow-modal scale-in overflow-hidden flex flex-col" style="max-height: 70vh">
        <div class="flex items-center justify-between px-5 h-12 border-b border-border-subtle shrink-0">
          <h2 class="text-sm font-semibold text-text-primary" data-i18n="paywall.title"></h2>
          <button id="paywallCloseBtn" class="modal-close-btn" data-i18n-title="common.close" data-i18n-aria-label="common.close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="overflow-y-auto scrollbar-thin px-5 py-4 flex-1">
          <div class="mb-5 text-center">
            <div class="text-3xl mb-3 text-accent flex justify-center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
            <p id="paywallReason" class="text-sm text-text-tertiary" data-i18n="paywall.reason_default"></p>
          </div>
          <div class="space-y-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1.5" data-i18n="paywall.license_key"></label>
              <input id="licenseInput" type="text" data-i18n-placeholder="paywall.license_placeholder" autocomplete="off"
                class="w-full bg-surface-2 border border-border-default rounded-xl px-4 py-3 text-sm outline-none focus:border-accent transition-colors text-text-primary" />
            </div>
            <div id="paywallError" class="hidden text-sm text-red-400 bg-red-400/10 border border-red-400/30 rounded-xl px-4 py-3"></div>
          </div>
        </div>

    <script>
      // ============================================================
      // EchoMind 前端打包文件 — 由 scripts/build-ui.mjs 自动生成
      // 源码位于 ui/src/*.js（模块化开发，支持 Vitest 单元测试）
      // 此文件由构建脚本拼接生成，请勿手动编辑
      // ============================================================
      
      // ============================================================
      // 模块: state.js
      // ============================================================
      /**
       * EchoMind 状态容器 — Observable 模式，替代 15 个全局可变变量。
       *
       * 设计原则：
       * 1. 单一真相源 — 所有 UI 状态集中管理，不再散落在全局 let 变量中
       * 2. 不可变更新 — 通过 setState() 修改，始终返回新快照
       * 3. 订阅通知 — 组件可订阅状态变化，自动更新 UI（观察者模式）
       * 4. 可测试 — 导出 getState() / setState()，测试中可直接读写和断言
       *
       * 灵感来源：Redux（单一 store）+ MobX（细粒度订阅）+ Vue 3（响应式 ref）
       */
      
      // ============================================================
      // 类型定义（JSDoc）
      // ============================================================
      
      /**
       * @typedef {Object} EchoState

       * @param {Object} [params] - 占位符参数（如 { name: 'test.md' }）

      /**
       * EchoMind Markdown 渲染引擎 — marked → DOMPurify → highlight.js 链路。
       *
       * 安全铁律：模型输出必须经 DOMPurify 白名单消毒（REQ-SEC-002）。
       *
       * 富内容支持：
       * - 代码块：语言标签 + 复制按钮（highlight.js）
       * - Mermaid 图表：流式占位 → chat_done 后渲染为 SVG
       * - KaTeX 公式：行内 $...$ / 块级 $...$
       * - Chart.js：Markdown 表格 → 可切换图表视图
       * - GitHub Alerts：[!NOTE]/[!TIP]/[!IMPORTANT]/[!WARNING]/[!CAUTION]
       * - 行内引用标记：[1] [2] → 可点击 cite-ref

      // ============================================================

      /**
       * 增强代码块：包裹 .code-block + 头部栏（语言标签 + 复制按钮）。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       */
      function enhanceCodeBlocks(mdEl) {
        mdEl.querySelectorAll('pre').forEach((pre) => {
          if (pre.closest('.mermaid-source, .code-block')) return;
          const code = pre.querySelector('code');
          if (!code) return;
          if (!code.dataset.highlighted) {
            try { hljs.highlightElement(code); } catch (_) { /* 半截语法容错 */ }
          }
          const langMatch = /language-(\w+)/.exec(code.className);
          const lang = langMatch ? langMatch[1] : 'code';
          const wrapper = document.createElement('div');
          wrapper.className = 'code-block';
          const header = document.createElement('div');
          header.className = 'code-header';
          const langLabel = document.createElement('span');
          langLabel.className = 'code-lang';
          langLabel.textContent = lang;
          header.appendChild(langLabel);
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = t('markdown.copy');
          btn.onclick = () => {
            navigator.clipboard.writeText(code.innerText ?? '');
            btn.textContent = t('markdown.copied');
            setTimeout(() => (btn.textContent = t('markdown.copy')), 1500);
          };
          header.appendChild(btn);
          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(header);
          wrapper.appendChild(pre);
        });
      }
      
      // ============================================================

      /**
       * 将 mermaid 代码块替换为占位元素（流式过程中不渲染，chat_done 后渲染）。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       */
      function replaceMermaidBlocks(mdEl) {
        mdEl.querySelectorAll('pre code[class*="mermaid"]').forEach((code) => {
          const pre = code.parentElement;
          if (!pre || pre.tagName !== 'PRE') return;
          const raw = code.textContent;
          const div = document.createElement('div');
          div.className = 'mermaid-source';
          div.setAttribute('data-raw', raw);
          const srcPre = document.createElement('pre');
          srcPre.className = 'text-xs text-slate-400';

          const hint = document.createElement('div');
          hint.className = 'mermaid-placeholder text-xs mt-1';

      /**
       * 渲染 .mermaid-source 占位元素为 SVG（chat_done 后调用）。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       */
      async function renderMermaid(mdEl) {
        const sources = mdEl.querySelectorAll('.mermaid-source:not(.mermaid-rendered):not(.mermaid-error)');
        for (const el of sources) {
          const raw = el.getAttribute('data-raw') || '';
          try {
            const id = 'mmd-' + Math.random().toString(36).slice(2, 10);
            const { svg } = await mermaid.render(id, raw);
            el.innerHTML = svg;
            el.classList.add('mermaid-rendered');
          } catch (_) {
            el.classList.add('mermaid-error');
            el.innerHTML = '';
            const errMsg = document.createElement('div');
            errMsg.className = 'text-red-400 text-xs mb-1';
            errMsg.textContent = t('markdown.mermaid_error');
            el.appendChild(errMsg);
            const srcPre = document.createElement('pre');
            srcPre.className = 'text-xs text-slate-400 overflow-x-auto';

      // ============================================================
      // GitHub Alerts (Callout)
      // ============================================================
      
      const ALERT_CONFIG = {
        note: { icon: 'ℹ️', label: 'Note' },
        tip: { icon: '💡', label: 'Tip' },
        important: { icon: '❗', label: 'Important' },
        warning: { icon: '⚠️', label: 'Warning' },
        caution: { icon: '🔴', label: 'Caution' },
      };
      
      /**
       * 检测 blockquote 中的 [!NOTE]/[!TIP] 等，转换为 callout div。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       */
      function enhanceCallouts(mdEl) {
        mdEl.querySelectorAll('blockquote').forEach((bq) => {
          const firstP = bq.querySelector('p');
          if (!firstP) return;
          const text = firstP.textContent.trim();
          const match = /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i.exec(text);
          if (!match) return;
          const type = match[1].toLowerCase();
          const cfg = ALERT_CONFIG[type];
          if (!cfg) return;
          const callout = document.createElement('div');
          callout.className = 'callout callout-' + type;
          const title = document.createElement('div');
          title.className = 'callout-title';
          title.innerHTML = '<span>' + cfg.icon + '</span><span>' + cfg.label + '</span>';
          callout.appendChild(title);
          const rest = text.slice(match[0].length).trim();
          if (rest) { firstP.textContent = rest; }
          else { firstP.remove(); }
          const body = document.createElement('div');
          body.className = 'callout-body';
          while (bq.firstChild) body.appendChild(bq.firstChild);
          callout.appendChild(body);
          bq.replaceWith(callout);
        });
      }
      
      // ============================================================
      // 行内引用标记 [1] [2] → 可点击 cite-ref
      // ============================================================
      
      /**
       * 将文本中的 [1] [2] 等引用标记转换为可点击的 .cite-ref 元素。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       * @param {Array|null} sources - 引用来源列表
       */
      function enhanceCitations(mdEl, sources) {
        if (!sources || sources.length === 0) return;
        const walker = document.createTreeWalker(mdEl, NodeFilter.SHOW_TEXT, {
          acceptNode: (node) => {
            const parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            if (parent.closest('a, code, pre, .cite-ref, .callout-title')) return NodeFilter.FILTER_REJECT;
            return /\[(\d+)\]/.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          },
        });
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) textNodes.push(node);
        for (const textNode of textNodes) {
          const text = textNode.nodeValue;
          const regex = /\[(\d+)\]/g;
          let lastIndex = 0;
          let match;
          const fragments = [];
          while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
              fragments.push(document.createTextNode(text.slice(lastIndex, match.index)));
            }
            const num = parseInt(match[1], 10);
            if (num >= 1 && num <= sources.length) {
              const ref = document.createElement('span');
              ref.className = 'cite-ref';
              ref.textContent = '[' + num + ']';
              ref.setAttribute('data-cite', String(num));
              ref.onclick = () => {
                const block = mdEl.parentElement;
                if (!block) return;
                const toggle = block.querySelector('.sources-toggle');
                const list = block.querySelector('.sources-list');
                if (toggle && list && list.style.display === 'none') {
                  toggle.classList.add('expanded');
                  toggle.querySelector('svg').style.transform = 'rotate(180deg)';
                  list.style.display = 'flex';
                }
                const chips = list ? list.querySelectorAll('.source-chip') : [];
                const chip = chips[num - 1];
                if (chip) {
                  chip.style.transition = 'background 0.3s';
                  chip.style.background = 'rgba(56,189,248,0.4)';
                  setTimeout(() => { chip.style.background = ''; }, 1000);
                }
              };
              fragments.push(ref);
            } else {
              fragments.push(document.createTextNode(match[0]));
            }
            lastIndex = regex.lastIndex;
          }
          if (fragments.length > 0) {
            if (lastIndex < text.length) {
              fragments.push(document.createTextNode(text.slice(lastIndex)));
            }
            const parent = textNode.parentElement;
            if (parent) {
              fragments.forEach((f) => parent.insertBefore(f, textNode));
              parent.removeChild(textNode);
            }
          }
        }
      }

       * 增强任务列表：标记 task-item / task-done 类。

      // ============================================================
      // KaTeX 数学公式
      // ============================================================
      
      /**
       * 在 DOM 元素内渲染 KaTeX 数学公式（REQ-VIZ-002）。
       * @param {HTMLElement} el - Markdown 内容容器元素
       */
      function renderKatexInElement(el) {
        if (typeof katex === 'undefined') return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
          acceptNode: (node) => {
            const parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            if (parent.closest('pre, code, .katex, .mermaid-source')) return NodeFilter.FILTER_REJECT;
            return /\$/.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          },
        });
        const textNodes = [];
        let node;
        while ((node = walker.nextNode())) textNodes.push(node);
        for (const textNode of textNodes) {
          const text = textNode.nodeValue;
          const regex = /\$\$([\s\S]+?)\$\$|\$([^\$\n]+?)\$/g;
          let lastIndex = 0;
          let match;
          const fragments = [];
          while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
              fragments.push(document.createTextNode(text.slice(lastIndex, match.index)));
            }
            const isBlock = !!match[1];
            const latex = (match[1] || match[2] || '').trim();
            try {
              const html = katex.renderToString(latex, { throwOnError: true, displayMode: isBlock, output: 'html' });
              const container = document.createElement(isBlock ? 'div' : 'span');
              container.className = isBlock ? 'katex-block' : 'katex-inline';
              container.innerHTML = html;
              fragments.push(container);
            } catch (_) {
              const pending = document.createElement(isBlock ? 'div' : 'span');
              pending.className = 'katex-pending';
              pending.setAttribute('data-latex', latex);
              pending.setAttribute('data-display', String(isBlock));
              pending.textContent = match[0];
              fragments.push(pending);
            }
            lastIndex = regex.lastIndex;
          }
          if (fragments.length > 0) {
            if (lastIndex < text.length) {
              fragments.push(document.createTextNode(text.slice(lastIndex)));
            }
            const parent = textNode.parentElement;
            if (parent) {
              fragments.forEach((f) => parent.insertBefore(f, textNode));
              parent.removeChild(textNode);
            }
          }
        }
      }
      
      /**
       * 重试渲染流式期间未能渲染的 KaTeX 公式（chat_done 后调用）。
       * @param {HTMLElement} mdEl - Markdown 内容容器
       */
      function retryPendingKatex(mdEl) {
        const pendingKatex = mdEl.querySelectorAll('.katex-pending');
        for (const kp of pendingKatex) {
          const latex = kp.getAttribute('data-latex') || '';
          const isBlock = kp.getAttribute('data-display') === 'true';
          try {
            const html = katex.renderToString(latex, { throwOnError: true, displayMode: isBlock, output: 'html' });
            kp.innerHTML = html;
            kp.classList.remove('katex-pending');
            kp.classList.add(isBlock ? 'katex-block' : 'katex-inline');
          } catch (_) {
            kp.classList.remove('katex-pending');
            kp.classList.add('katex-error');
            kp.textContent = t('markdown.katex_error') + latex;
          }
        }
      }
      
      // ============================================================
      // Chart.js 表格 → 图表
      // ============================================================
      
      /**
       * 解析 Markdown 表格为 Chart.js 数据格式。
       * @param {HTMLTableElement} table - 表格元素
       * @returns {{labels: string[], datasets: Array}|null}
       */
      function parseTableForChart(table) {
        const headerCells = table.querySelectorAll('thead th, thead td');
        if (headerCells.length === 0) return null;
        const labels = Array.from(headerCells).slice(1).map((c) => c.textContent.trim());
        if (labels.length === 0) return null;
        const bodyRows = table.querySelectorAll('tbody tr');
        if (bodyRows.length === 0) return null;
        const datasets = [];
        const palette = ['#38BDF8', '#f97316', '#22c55e', '#a78bfa', '#f43f5e', '#eab308'];
        for (let i = 0; i < bodyRows.length; i++) {
          const cells = bodyRows[i].querySelectorAll('td');
          if (cells.length < 2) continue;
          datasets.push({
            label: cells[0].textContent.trim(),
            data: Array.from(cells).slice(1).map((c) => parseFloat(c.textContent.replace(/[^0-9.\-]/g, '')) || 0),
            backgroundColor: palette[i % palette.length],
            borderColor: palette[i % palette.length],
          });
        }
        return { labels, datasets };
      }
      
      /**
       * 用 Chart.js 渲染图表到 canvas。
       * @param {HTMLCanvasElement} canvas
       * @param {string} type - 图表类型（bar/line/pie）
       * @param {{labels: string[], datasets: Array}} data
       * @returns {Chart}
       */
      function renderChart(canvas, type, data) {
        const config = {
          type,
          data: { labels: data.labels, datasets: data.datasets.map((ds) => ({ ...ds, borderWidth: 1 })) },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#94a3b8', font: { size: 11 } } },
              tooltip: { backgroundColor: '#1C1C1E', titleColor: '#E2E8F0', bodyColor: '#94a3b8' },
            },
            scales: type === 'pie' ? {} : {
              x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.08)' } },
              y: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.08)' } },
            },
          },
        };
        return new Chart(canvas, config);
      }
      
      /**
       * 为 Markdown 表格注入「切换图表视图」按钮。
       * @param {HTMLElement} mdEl
       */
      function enhanceTablesForChart(mdEl) {
        if (typeof Chart === 'undefined') return;
        if (!Chart._echomindDefaults) {
          Chart.defaults.color = '#94a3b8';
          Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';
          Chart._echomindDefaults = true;
        }
        const tables = mdEl.querySelectorAll('table:not(.chart-enhanced)');
        for (const table of tables) {
          table.classList.add('chart-enhanced');
          const data = parseTableForChart(table);
          if (!data || data.labels.length === 0 || data.datasets.length === 0) continue;
          const btn = document.createElement('button');
          btn.className = 'chart-toggle';
          btn.textContent = t('markdown.chart_toggle_chart');
          let chartInstance = null;
          let chartContainer = null;
          btn.addEventListener('click', () => {
            if (chartContainer) {
              chartContainer.remove();
              chartContainer = null;
              if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
              btn.textContent = t('markdown.chart_toggle_chart');
              table.style.display = '';
              return;
            }
            table.style.display = 'none';
            chartContainer = document.createElement('div');
            chartContainer.className = 'chart-container';
            const typeBar = document.createElement('div');
            typeBar.className = 'chart-type-bar';
            const types = [
              { type: 'bar', label: t('markdown.chart_bar') },
              { type: 'line', label: t('markdown.chart_line') },
              { type: 'pie', label: t('markdown.chart_pie') },
            ];
            for (const t of types) {
              const tb = document.createElement('button');
              tb.textContent = t.label;
              tb.dataset.type = t.type;
              tb.addEventListener('click', () => {
                typeBar.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
                tb.classList.add('active');
                if (chartInstance) chartInstance.destroy();
                chartInstance = renderChart(canvas, t.type, data);
              });
              typeBar.appendChild(tb);
            }
            const canvas = document.createElement('canvas');
            chartContainer.appendChild(typeBar);
            chartContainer.appendChild(canvas);
            table.parentNode.insertBefore(chartContainer, table.nextSibling);
            typeBar.querySelector('button').click();
            btn.textContent = t('markdown.chart_toggle_table');
          });
          table.parentNode.insertBefore(btn, table);
        }
      }
      
      // ============================================================
      // 主渲染入口
      // ============================================================
      
      /**
       * 将 currentRawMarkdown 经 marked → DOMPurify → highlight.js 链路渲染到当前 assistant Block。
       * 安全铁律：模型输出必须经 DOMPurify 白名单消毒（REQ-SEC-002）。
       * @param {HTMLElement} mdEl - .md 内容容器
       * @param {string} rawMarkdown - 原始 Markdown 文本

      function renderMarkdown(mdEl, rawMarkdown, sources) {

      async function renderRichContent(mdEl) {

      // ============================================================
      // 模块: context-menu.js
      // ============================================================
      /**
       * EchoMind 自定义右键上下文菜单模块（REQ-IX-003 / REQ-UI-012）。
       *
       * 取代 Tauri WebView 的浏览器默认右键菜单，提供与桌面应用一致的
       * 剪切/复制/粘贴/全选体验。仅在有可编辑文本或选中文本时显示相关项。
       *
       * 技术要点：
       * - contextmenu 事件 preventDefault 抑制浏览器默认菜单
       * - document.execCommand 执行 clipboard 操作（Tauri WebView 仍支持）
       * - 菜单定位考虑视口边界，防溢出
       * - 点击外部 / Escape / 滚动 / 失焦 → 自动关闭
       */
      
      
      /** 当前菜单是否可见 */
      let _visible = false;
      
      /**
       * 初始化全局右键菜单：注册 contextmenu 事件 + 关闭监听。
       * 在 main.js boot() 中调用。
       */
      function initContextMenu() {
        const menu = $('ctxMenu');
        if (!menu) return;
      
        // 全局 contextmenu：抑制浏览器默认菜单，显示自定义菜单
        document.addEventListener('contextmenu', (e) => {
          // 输入框/文本域/可编辑区 → 显示编辑菜单
          const target = e.target;
          const isEditable = _isEditable(target);
          const hasSelection = _hasSelection();
      
          // 非编辑且无选中 → 不显示菜单（也抑制默认）
          if (!isEditable && !hasSelection) {
            e.preventDefault();
            return;
          }
      
          e.preventDefault();
          _showMenu(e.clientX, e.clientY, { isEditable, hasSelection });
        });
      
        // 点击外部关闭
        menu.addEventListener('click', (e) => {
          e.stopPropagation();
          const item = e.target.closest('.ctx-item');
          if (item && !item.classList.contains('disabled')) {
            const action = item.dataset.action;
            _executeAction(action);
            _hideMenu();
          }
        });
      
        // 全局点击 / Escape / 滚动 → 关闭
        document.addEventListener('click', () => _hideMenu(), true);
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && _visible) {
            e.stopPropagation();
            _hideMenu();
          }
        });
        window.addEventListener('blur', () => _hideMenu());
        document.addEventListener('scroll', () => _hideMenu(), true);
      }
      
      /**
       * 显示右键菜单。
       * @param {number} x - 鼠标 clientX
       * @param {number} y - 鼠标 clientY
       * @param {{isEditable:boolean, hasSelection:boolean}} ctx - 上下文状态
       */
      function _showMenu(x, y, ctx) {
        const menu = $('ctxMenu');
        if (!menu) return;
      
        // 根据上下文渲染菜单项
        menu.innerHTML = _buildItems(ctx);
      
        // 先显示再测量尺寸（否则 offsetWidth=0）
        menu.classList.add('visible');
        const mw = menu.offsetWidth;
        const mh = menu.offsetHeight;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
      
        // 边界溢出修正
        if (x + mw > vw - 4) x = vw - mw - 4;
        if (y + mh > vh - 4) y = vh - mh - 4;
        menu.style.left = Math.max(4, x) + 'px';
        menu.style.top = Math.max(4, y) + 'px';
      
        _visible = true;
      }
      
      /** 隐藏右键菜单。 */
      function _hideMenu() {
        if (!_visible) return;
        const menu = $('ctxMenu');
        if (menu) menu.classList.remove('visible');
        _visible = false;
      }
      
      /**
       * 构建菜单项 HTML。
       * @param {{isEditable:boolean, hasSelection:boolean}} ctx
       * @returns {string} 菜单项 HTML
       */
      function _buildItems(ctx) {
        const mod = '⌘'; // macOS Cmd（Tauri 桌面端为主）
        const items = [];
      
        // 剪切：仅可编辑且有选中
        items.push(_item('cut', t('ctx.cut'), mod + 'X', ctx.isEditable && ctx.hasSelection));
        // 复制：有选中即可
        items.push(_item('copy', t('ctx.copy'), mod + 'C', ctx.hasSelection));
        // 粘贴：仅可编辑
        items.push(_item('paste', t('ctx.paste'), mod + 'V', ctx.isEditable));
        items.push(_separator());
        // 全选：可编辑或有内容
        items.push(_item('selectAll', t('ctx.selectAll'), mod + 'A', ctx.isEditable || true));
      
        return items.join('');
      }
      
      /**
       * 构建单个菜单项 HTML。
       * @param {string} action - 动作标识
       * @param {string} label - 显示文案
       * @param {string} shortcut - 快捷键提示
       * @param {boolean} enabled - 是否可用
       * @returns {string} HTML
       */
      function _item(action, label, shortcut, enabled) {
        const cls = enabled ? 'ctx-item' : 'ctx-item disabled';
        return `<div class="${cls}" data-action="${action}"><span>${label}</span><span class="ctx-shortcut">${shortcut}</span></div>`;
      }
      
      /** 构建分隔线 HTML。 */
      function _separator() {
        return '<div class="ctx-separator"></div>';
      }
      
      /**
       * 执行菜单动作。
       * @param {string} action - cut/copy/paste/selectAll
       */
      function _executeAction(action) {
        // execCommand 虽已 deprecated，但 Tauri WebView 仍完整支持，
        // 且能正确处理选中范围与剪贴板读写，无需额外权限。
        try {
          document.execCommand(action);
        } catch (_) {
          // 静默忽略 — 用户不会看到错误
        }
      }
      
      /**
       * 检查元素是否为可编辑文本输入。
       * @param {Element} el
       * @returns {boolean}
       */
      function _isEditable(el) {
        if (!el) return false;
        if (el.isContentEditable) return true;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA';
      }
      
      /**
       * 检查当前是否有文本被选中。
       * @returns {boolean}
       */
      function _hasSelection() {
        const sel = window.getSelection();
        return !!sel && sel.toString().trim().length > 0;
      }

          regenBtn.onclick = () => {
            // REQ-RAG-012 AC-4：以相同问题重新发起查询，新回答追加到对话末尾（不覆盖原回答）

      // ============================================================

      /**
       * 设置输入框状态机（idle / streaming / error）。
       * @param {'idle'|'streaming'|'error'} state - 目标状态
       * @param {string} [hint=''] - 状态提示文案
       */
      function setInputState(state, hint = '') {
        const isStreaming = state === 'streaming';
        setState({ streaming: isStreaming });
        $('queryInput').disabled = isStreaming;
        $('sendBtn').classList.toggle('hidden', isStreaming);
        $('stopBtn').classList.toggle('hidden', !isStreaming);

      /**
       * 流结束后的状态收尾。
       * @param {boolean} ok - true=正常完成；false=错误/中断
       */
      function finalizeStream(ok) {
        const assistantEl = get('currentAssistantEl');
        const rawMd = get('currentRawMarkdown');
        const sources = get('lastSources');
      
        if (assistantEl) {
          const thinking = assistantEl.querySelector('.thinking-indicator');
          if (thinking) thinking.remove();
          const mdEl = assistantEl.querySelector('.md');
          if (mdEl) mdEl.classList.remove('hidden');
          if (ok && rawMd) {
            showMsgActions(assistantEl, rawMd);
          }
        }
      
        if (ok && rawMd) {
          const history = [...get('history'), { role: 'assistant', content: rawMd, sources }];
          setState({ history });
        }
      
        setState({
          currentRawMarkdown: '',
          lastSources: null,
          currentAssistantEl: null,
        });

      /**
       * 发送用户问题：追加 user Block、初始化 assistant Block、调用 chat IPC 启动流式对话。
       */
      async function send() {
        const query = $('queryInput').value.trim();
        if (!query || get('streaming')) return;
        $('queryInput').value = '';
        $('queryInput').style.height = 'auto';
        appendUserBlock(query);
      
        const history = [...get('history'), { role: 'user', content: query, sources: null }];
        setState({
          history,
          currentRawMarkdown: '',
          lastSources: null,
        });
      
        const assistantEl = appendBlock('assistant');
        // REQ-RAG-012 AC-4：存储对应的用户问题，供「重新生成」使用
        assistantEl.dataset.query = query;
        setState({ currentAssistantEl: assistantEl });
        setInputState('streaming', t('chat.retrieving_kb'));
      
        try {
          await invoke('chat', {
            query,
            history: history.slice(0, -1),
            conversationId: get('currentConversationId'),
          });
        } catch (err) {
          toastError(err);
          finalizeStream(false);
          setInputState('error', sanitizeError(err));
        }
      }

      async function onStop() {
        try {
          const auditingDocId = get('auditingDocId');
          if (auditingDocId) {
            await invoke('abort_audit', { docId: auditingDocId });
          } else {
            await invoke('abort_chat', { conversationId: get('currentConversationId') });
          }
        } catch (err) {

        }

      async function auditDocument(docId, docName) {
        if (get('streaming')) { toast(t('chat.streaming_hint'), 'info'); return; }
        if (!get('isPro')) { return; }
      
        setState({ auditingDocId: docId });
        const assistantEl = appendBlock('assistant');
        setState({ currentAssistantEl: assistantEl });
      
        const thinkingText = assistantEl.querySelector('.thinking-text');
        if (thinkingText) thinkingText.textContent = t('chat.thinking_audit_init');
        setInputState('streaming', t('chat.thinking_auditing'));
      
        try {

          setInputState('error', String(err));
          setState({ auditingDocId: null });

      // ============================================================
      // 对话上下文长度管理（REQ-RAG-017）
      // ============================================================
      
      /**
       * 显示「部分历史已折叠」提示并隐藏被截断的消息块（REQ-RAG-017 AC-2/AC-3）。
       * 策略：保留首轮（前2条）+ 最近 N 轮，隐藏中间消息。
       * @param {{ truncated_count, total_tokens, retained_tokens, token_limit }} payload
       */
      function showCollapsedHint(payload) {
        const { truncated_count, total_tokens, retained_tokens, token_limit } = payload;
        if (truncated_count === 0) return;
      
        const chatArea = $('chatArea');
        if (!chatArea) return;
        const blocks = chatArea.querySelectorAll('.message-in');
        if (blocks.length < 2 + truncated_count) return;
      
        // 隐藏中间被截断的消息块（索引 2 到 2+truncated_count-1）
        const startIndex = 2;
        const endIndex = 1 + truncated_count;
        for (let i = startIndex; i <= endIndex; i++) {
          const block = blocks[i];
          if (block) {
            block.dataset.collapsed = 'true';
            block.style.display = 'none';
          }
        }
      
        // 在首轮和隐藏消息之间插入提示条
        const hint = document.createElement('div');
        hint.className = 'context-collapsed-hint text-xs text-text-quaternary py-2 text-center border-b border-border-subtle';
        hint.innerHTML = `<span class="cursor-pointer hover:text-accent" data-i18n="chat.context_collapsed" data-i18n-arg-count="${truncated_count}"></span> <span class="text-text-quaternary/60 ml-2">(保留 ${retained_tokens} / ${total_tokens} tokens)</span>`;
        hint.dataset.expanded = 'false';
      
        hint.onclick = () => {
          const isExpanded = hint.dataset.expanded === 'true';
          if (isExpanded) {
            // 折叠
            hint.dataset.expanded = 'false';
            for (let i = startIndex; i <= endIndex; i++) {
              const block = blocks[i];
              if (block) {
                block.dataset.collapsed = 'true';
              }
            }
            setTimeout(() => {
              for (let i = startIndex; i <= endIndex; i++) {
                const block = blocks[i];
                if (block) {
                  block.style.display = 'none';
                }
              }
            }, 0);
          } else {
            // 展开
            hint.dataset.expanded = 'true';
            for (let i = startIndex; i <= endIndex; i++) {
              const block = blocks[i];
              if (block) {
                block.dataset.collapsed = 'false';
                block.style.display = '';
              }
            }
          }
          refreshI18nElements();
        };
      
        // 插入到首轮之后（第2个 .message-in 之后）
        const insertAfter = blocks[1] || blocks[0];
        if (insertAfter) {
          insertAfter.after(hint);
        }
      }

      /**
       * 注册对话流相关的所有 Tauri 事件监听。
       * 在 main.js 中调用。
       */
      function initChatEventListeners(callbacks) {
        const { onChatDone, onDocStatusChanged, onImportProgress, onEmbeddingProgress, onModelDownload } = callbacks;
      
        listen('audit_phase', (e) => {
          const p = e.payload;
          const el = get('currentAssistantEl');
          if (el) {
            const textEl = el.querySelector('.thinking-text');
            if (textEl) textEl.textContent = p.message;
          }
          $('inputHint').textContent = p.message;
        });
      
        listen('chat_phase', (e) => {
          const p = e.payload;
          const el = get('currentAssistantEl');
          if (el) {
            const textEl = el.querySelector('.thinking-text');
            if (textEl) textEl.textContent = p.message;
          }
          $('inputHint').textContent = p.message;
        });
      
        listen('chat_token', (e) => {
          const el = get('currentAssistantEl');
          if (el) {
            const thinking = el.querySelector('.thinking-indicator');
            if (thinking) thinking.remove();
            const mdEl = el.querySelector('.md');
            if (mdEl) mdEl.classList.remove('hidden');
          }
          setState({ currentRawMarkdown: get('currentRawMarkdown') + e.payload });
          scheduleRender();
        });
      
        listen('chat_sources', (e) => renderSources(e.payload));
      
        listen('chat_error', (e) => {
          const msg = String(e.payload);
          if (msg.includes('已中断') || msg.includes('aborted') || msg.includes('Aborted')) {
            const el = get('currentAssistantEl');
            if (el) {
              const badge = document.createElement('div');
              badge.className = 'mt-2 text-[11px] text-slate-500';
              badge.textContent = t('chat.aborted_badge');
              el.querySelector('.md').appendChild(badge);
            }
            toast(t('chat.aborted'), 'info');
          } else {
            toastError(msg);
            finalizeStream(false);
            setInputState('error', sanitizeError(msg));
          }
        });
      
        listen('chat_done', async () => {
          const el = get('currentAssistantEl');
          if (el) {
            const mdEl = el.querySelector('.md');
            if (mdEl) await renderRichContent(mdEl);
          }
          finalizeStream(true);
          setInputState('idle');
          if (get('auditingDocId')) {
            setState({ auditingDocId: null });
          } else {
            await onChatDone?.();
          }
        });
      
        listen('doc-status-changed', (e) => {
          const p = e.payload;
          toast(p.message, p.status === 'error' ? 'error' : 'info');
          onDocStatusChanged?.();
        });
      
        listen('import-progress', (e) => {
          const p = e.payload;
          if (p.cancelled) {
            toast(t('import.import_cancelled'), 'info');
            onImportProgress?.(null);
            onDocStatusChanged?.();
            return;
          }
          onImportProgress?.(p);
        });
      
        listen('embedding_progress', (e) => {
          onEmbeddingProgress?.(e.payload);
        });
      
        listen('model_download_progress', (e) => {
          onModelDownload?.(e.payload);
        });
      
        // REQ-RAG-017：对话上下文截断事件 — 显示「部分历史已折叠」提示
        listen('chat_context_truncated', (e) => {
          showCollapsedHint(e.payload);
        });
      
        // 文件监听同步进度事件（REQ-SYNC-002 AC-7）
        listen('sync_progress', (e) => {
          const p = e.payload;
          if (p.phase === 'complete') {
            toast(p.message, 'success');
          } else if (p.phase === 'error') {
            toast(p.message, 'error');
          }
        });
      }

      // ============================================================
      // 会话搜索弹框
      // ============================================================
      
      /** 搜索弹框当前过滤后的会话列表 */
      let _searchFiltered = [];
      /** 搜索弹框当前选中索引 */
      let _searchSelectedIndex = 0;
      
      /**
       * 打开会话搜索弹框：加载全部会话，实时过滤，键盘导航选择。
       */
      function openSearchPopup() {
        const popup = $('convSearchPopup');
        if (!popup) return;
        popup.classList.remove('hidden');
        const input = $('convSearchPopupInput');
        if (input) {
          input.value = '';
          input.focus();
        }
        _searchFiltered = [];
        _searchSelectedIndex = 0;
        _renderSearchResults();
      }
      
      /** 关闭会话搜索弹框。 */
      function closeSearchPopup() {
        const popup = $('convSearchPopup');
        if (popup) popup.classList.add('hidden');
      }
      
      /** 每页渲染数量 */
      const SEARCH_PAGE_SIZE = 50;
      /** 当前已渲染数量 */
      let _searchRenderedCount = 0;
      
      /**
       * 拉取会话列表并渲染到搜索弹框结果区（初始仅渲染前 50 条，滚动加载更多）。
       * @param {string} [searchTerm=''] - 搜索关键词
       */
      async function _renderSearchResults(searchTerm = '') {
        const list = await invoke('get_conversations', { workspaceId: WORKSPACE });
        const term = searchTerm.trim().toLowerCase();
        _searchFiltered = term
          ? list.filter(c => (c.title || '').toLowerCase().includes(term))
          : list;
        _searchSelectedIndex = 0;
        _searchRenderedCount = 0;
        const box = $('convSearchResults');
        if (!box) return;
        box.innerHTML = '';
      
        if (_searchFiltered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'px-4 py-6 text-center text-[11px] text-text-quaternary';
          empty.textContent = term ? t('command_palette.no_results') : t('chat.empty_messages_desc');
          box.appendChild(empty);
          return;
        }
      
        _renderSearchPage(box);
      }
      
      /**
       * 渲染一页搜索结果（SEARCH_PAGE_SIZE 条）。
       * @param {HTMLElement} box - 结果容器
       */
      function _renderSearchPage(box) {
        const endIndex = Math.min(_searchRenderedCount + SEARCH_PAGE_SIZE, _searchFiltered.length);
        for (let i = _searchRenderedCount; i < endIndex; i++) {
          const c = _searchFiltered[i];
          const item = document.createElement('div');
          item.className = `flex items-center gap-2 px-4 py-2.5 cursor-pointer text-sm transition-colors ${i === _searchSelectedIndex ? 'bg-accent/15 text-accent' : 'text-text-secondary hover:bg-white/5'}`;
          const icon = document.createElement('span');
          icon.className = 'shrink-0 text-text-quaternary';
          icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
          const title = document.createElement('span');
          title.className = 'truncate';
          title.textContent = c.title || t('backend.placeholder_title');
          item.appendChild(icon);
          item.appendChild(title);
          item.onclick = () => {
            closeSearchPopup();
            _onSelectConversation(c.id);
          };
          box.appendChild(item);
        }
        _searchRenderedCount = endIndex;
      }
      
      /**
       * 滚动到底部时加载更多搜索结果。
       */
      function _loadMoreSearchResults() {
        if (_searchRenderedCount >= _searchFiltered.length) return;
        const box = $('convSearchResults');
        if (!box) return;
        _renderSearchPage(box);
      }
      
      /** 选中会话后的回调（由 main.js 注入）。 */
      let _onSelectConversation = () => {};
      
      /**
       * 初始化搜索弹框事件绑定。
       * @param {(id: string) => Promise<void>} onSelectConversation - 选中会话后的回调
       */
      function initSearchPopup(onSelectConversation) {
        _onSelectConversation = onSelectConversation || (() => {});
        const popup = $('convSearchPopup');
        if (!popup) return;
        const input = $('convSearchPopupInput');
      
        // 会话搜索弹框关闭按钮
        if ($('convSearchClose')) {
          $('convSearchClose').onclick = closeSearchPopup;
        }
      
        // 实时过滤
        if (input) {
          let timer = null;
          input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => _renderSearchResults(input.value), 150);
          });
          // 键盘导航
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              e.preventDefault();
              closeSearchPopup();
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (_searchFiltered.length === 0) return;
              _searchSelectedIndex = Math.min(_searchSelectedIndex + 1, _searchFiltered.length - 1);
              _updateSearchSelection();
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (_searchFiltered.length === 0) return;
              _searchSelectedIndex = Math.max(_searchSelectedIndex - 1, 0);
              _updateSearchSelection();
            } else if (e.key === 'Enter') {
              e.preventDefault();
              if (_searchFiltered.length === 0) return;
              const conv = _searchFiltered[_searchSelectedIndex];
              if (conv) {
                closeSearchPopup();
                _onSelectConversation(conv.id);
              }
            }
          });
        }
      
        // 无限滚动：滚动到底部时加载更多
        const resultsBox = $('convSearchResults');
        if (resultsBox) {
          resultsBox.addEventListener('scroll', () => {
            if (resultsBox.scrollTop + resultsBox.clientHeight >= resultsBox.scrollHeight - 50) {
              _loadMoreSearchResults();
            }
          });
        }
      }
      
      /** 更新搜索弹框中的选中项样式。 */
      function _updateSearchSelection() {
        const box = $('convSearchResults');
        if (!box) return;
      
        // 如果选中索引超出已渲染范围，先加载更多
        if (_searchSelectedIndex >= _searchRenderedCount) {
          _renderSearchPage(box);
        }
      
        const items = box.querySelectorAll('[class*="cursor-pointer"]');
        items.forEach((item, i) => {
          if (i === _searchSelectedIndex) {
            item.className = 'flex items-center gap-2 px-4 py-2.5 cursor-pointer text-sm transition-colors bg-accent/15 text-accent';
          } else {
            item.className = 'flex items-center gap-2 px-4 py-2.5 cursor-pointer text-sm transition-colors text-text-secondary hover:bg-white/5';
          }
        });
        // 滚动到选中项
        const selected = items[_searchSelectedIndex];
        if (selected) selected.scrollIntoView({ block: 'nearest' });
      }

      function toggleMultiSelect() {

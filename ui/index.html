        }
        updateSelectedCount();
        // 触发文档列表重新渲染（切换复选框显示）
        _onReloadDocs();
      }
      
      /**
       * 退出多选模式（恢复常规模式）。
       */
      function exitMultiSelect() {
        if (_multiSelectMode) toggleMultiSelect();
      }
      
      /**
       * 更新已选文档数量显示。
       */
      function updateSelectedCount() {
        const checked = document.querySelectorAll('#docList input[type="checkbox"]:checked').length;
        const countEl = $('kbSelectedCount');
        if (countEl) countEl.textContent = t('knowledge_base.selected_count', { count: checked });
      }
      
      /**
       * 显示批量删除确认对话框。
       */
      function showBatchDeleteConfirm() {
        const checked = document.querySelectorAll('#docList input[type="checkbox"]:checked');
        if (checked.length === 0) return;
        const countEl = $('kbConfirmCount');
        if (countEl) countEl.textContent = String(checked.length);
        const dialog = $('kbConfirmDialog');
        if (dialog) dialog.classList.remove('hidden');
      }
      
      /**
       * 取消批量删除（隐藏确认对话框）。
       */
      function cancelBatchDelete() {
        const dialog = $('kbConfirmDialog');
        if (dialog) dialog.classList.add('hidden');
      }
      
      /**
       * 确认批量删除：逐个调用 delete_document IPC，完成后刷新列表。
       */
      async function confirmBatchDelete() {
        const dialog = $('kbConfirmDialog');
        if (dialog) dialog.classList.add('hidden');
      
        const checked = document.querySelectorAll('#docList input[type="checkbox"]:checked');
        const docIds = Array.from(checked).map((cb) => cb.dataset.docId).filter(Boolean);
        if (docIds.length === 0) return;
      
        let successCount = 0;
        let failCount = 0;
        for (const docId of docIds) {
          try {
            await invoke('delete_document', { id: docId });
            successCount++;
          } catch (err) {
            failCount++;
          }
        }
      
        // 显示结果 toast
        if (failCount > 0) {
          toastError(t('knowledge_base.batch_delete_failed'));
        } else {
          toast(t('knowledge_base.batch_deleted', { count: successCount }), 'info');
        }
      
        // 退出多选模式并刷新列表
        exitMultiSelect();
        _onReloadDocs();
      }
      
      /**
       * 组合筛选文档列表：搜索关键词 + 索引状态 + 文件格式，三者取交集（REQ-ING-007）。
       * 筛选条件为空时显示全部文档。无匹配结果时显示「未找到匹配文档」空状态。
       */
      function filterDocuments() {
        const box = $('docList');
        if (!box) return;
      
        const searchQ = ($('docSearchInput')?.value || '').trim().toLowerCase();
        const statusFilter = $('docStatusFilter')?.value || '';
        const formatFilter = $('docFormatFilter')?.value || '';
      
        // 移除之前的「无匹配」空状态
        const noMatch = box.querySelector('.doc-no-match');
        if (noMatch) noMatch.remove();
      
        const items = box.querySelectorAll('[data-doc-name]');
        let visibleCount = 0;
        items.forEach((item) => {
          const name = (item.dataset.docName || '').toLowerCase();
          const status = item.dataset.docStatus || '';
          const format = item.dataset.docFormat || '';
      
          const matchSearch = !searchQ || name.includes(searchQ);
          const matchStatus = !statusFilter || status === statusFilter;
          const matchFormat = !formatFilter || format === formatFilter;
      
          if (matchSearch && matchStatus && matchFormat) {
            item.style.display = '';
            visibleCount++;
          } else {
            item.style.display = 'none';
          }
        });
      
        // 无匹配结果时显示空状态（REQ-ING-007 AC-4）
        if (visibleCount === 0 && items.length > 0) {
          const empty = document.createElement('div');
          empty.className = 'doc-no-match px-3 py-4 text-center text-[11px] text-text-quaternary';
          empty.textContent = t('knowledge_base.no_match');
          box.appendChild(empty);
        }
      }
      
      // ============================================================
      // 模块: command-palette.js
      // ============================================================
      /**
       * EchoMind 命令面板 — ⌘K 模糊搜索一切功能（FIGMA_DESIGN_SPEC §7 / REQ-KB-002）。
       *
       * 设计灵感：Raycast + VS Code Command Palette + Linear
       *
       * 依赖：state.js（命令面板状态）、utils.js（$ 工具函数）
       */
      
      
      
      // ============================================================
      // 命令定义
      // ============================================================
      
      /**
       * 命令对象结构。
       * @typedef {Object} Command
       * @property {string} group - 分组名
       * @property {string} icon - 图标字符
       * @property {string} label - 命令名称
       * @property {string} [shortcut] - 快捷键提示
       * @property {() => void} action - 执行函数
       */
      
      /**
       * 模糊匹配命令：支持中文和分组名搜索。
       * @param {string} query - 搜索关键词
       * @param {Command[]} commands - 全部命令
       * @returns {Command[]} 过滤后的命令列表
       */
      function filterCommands(query, commands) {
        const q = query.trim().toLowerCase();
        if (!q) return [...commands];
        return commands.filter((c) =>
          c.label.toLowerCase().includes(q) ||
          c.group.toLowerCase().includes(q),
        );
      }
      
      /**
       * 高亮匹配字符：将匹配部分包裹在 <span> 中。
       * @param {string} label - 原始标签
       * @param {string} query - 搜索关键词
       * @returns {string} 包含高亮 span 的 HTML 字符串
       */
      function highlightMatch(label, query) {
        const q = query.trim().toLowerCase();
        if (!q) return label;
        const pos = label.toLowerCase().indexOf(q);
        if (pos < 0) return label;
        return (
          label.slice(0, pos) +
          '<span class="text-accent font-medium">' +
          label.slice(pos, pos + q.length) +
          '</span>' +
          label.slice(pos + q.length)
        );
      }
      
      // ============================================================
      // 命令面板 DOM 操作
      // ============================================================
      
      /**
       * 渲染命令列表到 DOM。
       * @param {Command[]} commands - 全部命令清单
       * @param {string} query - 当前搜索关键词
       */
      function renderCommandList(commands, query) {
        const filtered = filterCommands(query, commands);
        setState({ cmdFiltered: filtered, cmdSelectedIndex: 0 });
      
        // 分组
        const groups = {};
        filtered.forEach((c) => { (groups[c.group] ||= []).push(c); });
      
        const list = $('cmdList');
        list.innerHTML = '';
      
        if (filtered.length === 0) {
          list.innerHTML =
            '<div class="px-4 py-8 text-center text-sm text-text-quaternary">' +
            '<div class="text-3xl mb-2 opacity-30">🔍</div>' + t('command_palette.no_results') + '</div>';
          return;
        }
      
        let idx = 0;
        const selectedIdx = get('cmdSelectedIndex');
        for (const [group, cmds] of Object.entries(groups)) {
          const header = document.createElement('div');
          header.className = 'px-4 pt-2 pb-1 text-[11px] uppercase tracking-wider text-text-quaternary';
          header.textContent = group;
          list.appendChild(header);
          for (const c of cmds) {
            const item = document.createElement('div');
            item.setAttribute('role', 'option');
            item.dataset.idx = String(idx);
            const isSel = idx === selectedIdx;
            item.className = `flex items-center gap-3 px-4 h-9 cursor-pointer text-sm transition-colors ${isSel ? 'bg-accent/10 text-text-primary' : 'text-text-secondary hover:bg-surface-3'}`;
            const labelHtml = highlightMatch(c.label, query);
            const shortcutHtml = c.shortcut
              ? `<kbd class="text-[11px] text-text-quaternary bg-surface-3 px-1.5 rounded-xs shrink-0">${c.shortcut}</kbd>`
              : '';
            item.innerHTML = `<span class="text-base shrink-0 w-5 text-center">${c.icon}</span><span class="flex-1 truncate">${labelHtml}</span>${shortcutHtml}`;
            item.onclick = () => { c.action(); closeCommandPalette(); };
            list.appendChild(item);
            idx++;
          }
        }
      }
      
      /**
       * 更新命令面板选中项视觉（上下键导航）。
       */
      function updateCmdSelection() {
        const selectedIdx = get('cmdSelectedIndex');
        const items = $('cmdList').querySelectorAll('[role="option"]');
        items.forEach((el, i) => {
          const isSel = i === selectedIdx;
          el.className = `flex items-center gap-3 px-4 h-9 cursor-pointer text-sm transition-colors ${isSel ? 'bg-accent/10 text-text-primary' : 'text-text-secondary hover:bg-surface-3'}`;
          if (isSel) el.scrollIntoView({ block: 'nearest' });
        });
      }
      
      /**
       * 打开命令面板：记录焦点、渲染列表、聚焦搜索框。
       */
      function openCommandPalette() {
        if (!$('commandPalette').classList.contains('hidden')) {
          closeCommandPalette();
          return;
        }
        setState({ cmdPrevFocus: document.activeElement });
        $('commandPalette').classList.remove('hidden');
        $('cmdSearch').value = '';
        renderCommandList(_commands, '');
        $('cmdSearch').focus();
      }
      
      /**
       * 关闭命令面板：隐藏、恢复焦点。
       */
      function closeCommandPalette() {
        $('commandPalette').classList.add('hidden');
        const prev = get('cmdPrevFocus');
        if (prev) prev.focus();
      }
      
      // ============================================================
      // 事件绑定
      // ============================================================
      
      /**
       * 初始化命令面板事件监听。
       * 在 main.js 中调用，传入命令清单和外部 action 函数。
       * @param {Command[]} commands - 命令清单
       */
      let _commands = [];
      
      function initCommandPalette(commands) {
        _commands = commands;
      
        $('cmdSearch').addEventListener('input', (e) => {
          renderCommandList(_commands, e.target.value);
        });
      
        $('cmdSearch').addEventListener('keydown', (e) => {
          const filtered = get('cmdFiltered');
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (filtered.length > 0) {
              setState({ cmdSelectedIndex: (get('cmdSelectedIndex') + 1) % filtered.length });
              updateCmdSelection();
            }
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (filtered.length > 0) {
              const newIdx = (get('cmdSelectedIndex') - 1 + filtered.length) % filtered.length;
              setState({ cmdSelectedIndex: newIdx });
              updateCmdSelection();
            }
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const selected = filtered[get('cmdSelectedIndex')];
            if (selected) { selected.action(); closeCommandPalette(); }
          } else if (e.key === 'Escape') {
            e.preventDefault();
            closeCommandPalette();
          }
        });
      
        // 关闭按钮
        if ($('cmdPaletteClose')) {
          $('cmdPaletteClose').onclick = closeCommandPalette;
        }
      }
      
      // ============================================================
      // 模块: keyboard.js
      // ============================================================
      /**
       * EchoMind 全局键盘快捷键模块（FIGMA_DESIGN_SPEC §7.4 / REQ-KB-001）。
       *
       * 快捷键清单：
       *   ⌘K   打开/关闭命令面板
       *   ⌘N   新建会话
       *   ⌘O   导入文件
       *   ⌘,   打开设置
       *   Esc  关闭最上层 Modal
       */
      
      
      /**
       * 初始化全局键盘快捷键。
       * @param {Object} handlers - 各快捷键对应的 action 函数
       * @param {() => void} handlers.onNewChat - 新建会话
       * @param {() => void} handlers.onImport - 导入文件
       * @param {() => void} handlers.onSettings - 打开设置
       * @param {() => void} handlers.onAbort - 停止生成/审计
       * @param {() => void} handlers.onCloseVlm - 关闭 VLM 确认弹窗
       * @param {() => void} handlers.onClosePaywall - 关闭付费墙
       * @param {() => void} handlers.onCloseSettings - 关闭设置面板
       * @param {() => void} handlers.onCloseSearchPopup - 关闭会话搜索弹框
       */
      function initKeyboardShortcuts(handlers) {
        document.addEventListener('keydown', (e) => {
          const mod = e.metaKey || e.ctrlKey; // macOS Cmd / Windows Ctrl
          const appVisible = !$('app') ? false : !$('app').classList.contains('hidden');
      
          // ⌘K 打开/关闭命令面板
          if (mod && e.key === 'k' && appVisible) {
            e.preventDefault();
            openCommandPalette();
            return;
          }
      
          // ⌘N 新建会话（仅主界面 + 非输入聚焦）
          if (mod && e.key === 'n' && appVisible && !isInputFocused()) {
            e.preventDefault();
            handlers.onNewChat();
            return;
          }
      
          // ⌘O 导入文件
          if (mod && e.key === 'o' && appVisible && !isInputFocused()) {
            e.preventDefault();
            handlers.onImport();
            return;
          }
      
          // ⌘, 打开设置
          if (mod && e.key === ',' && appVisible && !isInputFocused()) {
            e.preventDefault();
            handlers.onSettings();
            return;
          }
      
          // Esc — 按优先级关闭最上层 Modal
          if (e.key === 'Escape') {
            // 命令面板优先级最高
            const searchPopup = $('convSearchPopup');
            if (searchPopup && !searchPopup.classList.contains('hidden')) {
              handlers.onCloseSearchPopup();
              return;
            }
            const cmdPalette = $('commandPalette');
            if (cmdPalette && !cmdPalette.classList.contains('hidden')) {
              closeCommandPalette();
              return;
            }
            const vlmConfirm = $('vlmConfirm');
            if (vlmConfirm && !vlmConfirm.classList.contains('hidden')) {
              handlers.onCloseVlm();
              return;
            }
            const paywall = $('paywall');
            if (paywall && !paywall.classList.contains('hidden')) {
              handlers.onClosePaywall();
              return;
            }
            const settingsModal = $('settingsModal');
            if (settingsModal && !settingsModal.classList.contains('hidden')) {
              handlers.onCloseSettings();
              return;
            }
          }
        });
      }
      
      // ============================================================
      // 模块: wizard.js
      // ============================================================
      /**
       * EchoMind 配置向导模块 — Provider 预设卡片 + API Key + Base URL + Model。
       *
       * 职责：
       * 1. 渲染预设卡片（DeepSeek / OpenAI / Ollama）
       * 2. 应用预设值到输入框
       * 3. 验证 LLM 连接 → 持久化配置 → 进入主界面
       */
      
      
      
      
      
      
      /**
       * 渲染 Provider 预设卡片（DeepSeek / OpenAI / Ollama），高亮当前选中项。
       */
      function renderPresetCards() {
        const box = $('presetCards');
        box.innerHTML = '';
        for (const [key, p] of Object.entries(PRESETS)) {
          const btn = document.createElement('button');
          const active = key === get('activePreset');
          btn.className = `rounded-xl border px-4 py-4 text-left transition-colors ${active ? 'border-accent bg-accent/10' : 'border-line bg-panel hover:border-slate-500'}`;
          btn.innerHTML = `<div class="text-sm font-medium ${active ? 'text-accent' : ''}">${p.label}</div><div class="mt-1 text-[11px] text-slate-500">${t(p.descKey)}</div>`;
          btn.onclick = () => { setState({ activePreset: key }); applyPreset(); renderPresetCards(); };
          box.appendChild(btn);
        }
      }
      
      /**
       * 将当前选中的预设值填入向导输入框，并切换 API Key 可选性提示。
       */
      function applyPreset() {
        const p = PRESETS[get('activePreset')];
        $('wizUrl').value = p.base_url;
        $('wizModel').value = p.model;
        $('keyOptional').classList.toggle('hidden', p.needKey);
        $('wizError').classList.add('hidden');
        // Hide "Get API Key" link for custom preset (no key URL)
        const keyLink = $('wizKeyLink');
        if (keyLink) keyLink.classList.toggle('hidden', !p.keyUrl);
      }
      
      /**
       * 向导「验证并开始」流程：先 test_llm_connection 验证配置，成功后 update_llm_config 持久化并进入主界面。
       * @param {() => Promise} [onComplete] - 向导完成后的回调（通常为 initConversations）
       */
      async function startWizard(onComplete) {
        const p = PRESETS[get('activePreset')];
        const api_key = $('wizKey').value.trim();
        const base_url = $('wizUrl').value.trim();
        const model = $('wizModel').value.trim();
        const errBox = $('wizError');
        errBox.classList.add('hidden');
      
        if (p.needKey && !api_key) { errBox.textContent = t('wizard.error_no_key'); errBox.classList.remove('hidden'); return; }
        if (!base_url || !model) { errBox.textContent = t('wizard.error_no_url'); errBox.classList.remove('hidden'); return; }
      
        $('wizStart').disabled = true;
        $('wizStart').textContent = t('wizard.validating');
        try {
          await invoke('test_llm_connection', { apiKey: api_key, baseUrl: base_url, model });
        } catch (err) {
          errBox.textContent = String(err);
          errBox.classList.remove('hidden');
          $('wizStart').disabled = false;
          $('wizStart').textContent = t('wizard.start');
          return;
        }
        try {
          await invoke('update_llm_config', { config: { api_key, base_url, model } });
        } catch (err) {
          errBox.textContent = t('wizard.error_save_failed') + String(err);
          errBox.classList.remove('hidden');
          $('wizStart').disabled = false;
          $('wizStart').textContent = t('wizard.start');
          return;
        }
        $('wizStart').disabled = false;
        $('wizStart').textContent = t('wizard.start');
        showApp();
        toast(t('wizard.success'), 'success');
        if (onComplete) await onComplete();
      }
      
      /**
       * 初始化向导事件绑定。
       * @param {() => Promise} [onComplete] - 向导完成后的回调
       */
      function initWizard(onComplete) {
        $('wizStart').onclick = () => startWizard(onComplete);
        $('wizKeyLink').onclick = async () => {
          const url = PRESETS[get('activePreset')].keyUrl;
          try { await openUrl(url); }
          catch (_) { toast(t('wizard.manual_url') + url, 'info'); }
        };
      }
      
      // ============================================================
      // 模块: paywall.js
      // ============================================================
      /**
       * EchoMind 付费墙模块 — 配额触顶 / PDF 付费门 / License 激活 / 停用。
       *
       * 职责：
       * 1. 显示付费墙 Modal（设置升级原因文案）
       * 2. 激活 Pro License（验证签名 → 刷新 UI）
       * 3. 停用 Pro 授权
       * 4. 更新侧栏授权状态文案
       */
      
      
      
      
      
      /**
       * 显示付费墙 Modal，设置升级原因文案。
       * @param {string} reason - 触发付费墙的原因
       */
      function showPaywall(reason) {
        $('paywallReason').textContent = reason || t('paywall.reason_default');
        $('paywallError').classList.add('hidden');
        $('licenseInput').value = '';
        $('paywall').classList.remove('hidden');
      }
      
      /** 隐藏付费墙 Modal。 */
      function hidePaywall() {
        $('paywall').classList.add('hidden');
      }
      
      /**
       * 根据 isPro 全局状态刷新侧栏授权状态文案与颜色。
       */
      function updateProStatus() {
        const el = $('proStatus');
        const badge = $('proStatusBadge');
        if (!el || !badge) return;
        if (get('isPro')) {
          el.textContent = t('sidebar.pro_badge_pro');
          badge.className = 'inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-medium bg-accent/15 text-accent border border-accent/20';
          badge.querySelector('svg').innerHTML = '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>';
        } else {
          el.textContent = t('sidebar.pro_badge_free');
          badge.className = 'inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-medium bg-surface-3 text-text-tertiary border border-border-default';
          badge.querySelector('svg').innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>';
        }
      }
      
      /**
       * 激活 Pro License。
       */
      async function activatePro() {
        const key = $('licenseInput').value.trim();
        if (!key) {
          $('paywallError').textContent = t('paywall.error_no_key');
          $('paywallError').classList.remove('hidden');
          return;
        }
        $('paywallActivate').disabled = true;
        $('paywallActivate').textContent = t('paywall.activating');
        try {
          const result = await invoke('activate_pro', { licenseKey: key });
          if (result) {
            setState({ isPro: true });
            updateProStatus();
            hidePaywall();
            toastSuccess(t('paywall.activated'));
          }
        } catch (err) {
          $('paywallError').textContent = String(err);
          $('paywallError').classList.remove('hidden');
        }
        $('paywallActivate').disabled = false;
        $('paywallActivate').textContent = t('paywall.activate');
      }
      
      /**
       * 停用 Pro 授权（REQ-LIC-004）。
       */
      async function deactivatePro() {
        try {
          await invoke('deactivate_pro');
          setState({ isPro: false });
          updateProStatus();
          // 若设置面板打开，同步更新授权状态显示
          const settingsModal = $('settingsModal');
          if (settingsModal && !settingsModal.classList.contains('hidden')) {
            $('settingsLicenseInfo').innerHTML =
              '<span class="text-slate-400">' + t('settings.license_free') + '</span>';
          }
          toast(t('paywall.deactivated'), 'info');
        } catch (err) {
          toastError(err);
        }
      }
      
      /**
       * 初始化付费墙事件绑定。
       */
      function initPaywall() {
        $('paywallClose').onclick = hidePaywall;
        if ($('paywallCloseBtn')) $('paywallCloseBtn').onclick = hidePaywall;
        $('paywallActivate').onclick = activatePro;
        $('licenseInput').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') activatePro();

      }
      
      // ============================================================
      // 模块: settings.js
      // ============================================================
      /**
       * EchoMind 设置面板模块 — LLM 配置 / 推理模式 / 语言切换 / VLM 开关 / 授权状态 / 模型缓存 / 本地模型管理。
       *
       * 职责：
       * 1. 加载并渲染设置面板
       * 2. VLM Toggle 交互（含隐私确认弹窗）
       * 3. 模型缓存信息 / 下载 / 清理
       * 4. 界面语言切换（REQ-I18N-001）
       * 5. 本地 LLM 推理模式切换 + GGUF 模型管理（REQ-LLM-003/004）
       */
      
      
      
      
      
      
      
      
      
      /**
       * 打开设置面板：加载当前 LLM 配置与 VLM 开关状态并渲染。
       */
      async function openSettings() {
        try {
          const settings = await invoke('get_settings');
          const info = $('settingsLlmInfo');
          if (settings.has_llm_config) {
            info.innerHTML =
              '<div class="flex justify-between"><span class="text-slate-500">' + t('settings.endpoint') + '</span><span class="text-slate-200 break-all text-right max-w-[60%]">' + settings.base_url + '</span></div>' +
              '<div class="flex justify-between"><span class="text-slate-500">' + t('settings.model') + '</span><span class="text-slate-200">' + settings.model + '</span></div>' +
              '<div class="flex justify-between"><span class="text-slate-500">' + t('settings.key') + '</span><span class="text-slate-200">' + settings.api_key_masked + '</span></div>';
          } else {
            info.innerHTML = '<div class="text-slate-400 text-center py-2">' + t('settings.not_configured') + '</div>';
          }
          setState({ vlmEnabled: settings.vlm_enabled });
          updateVlmToggle();
      setState({ rerankEnabled: settings.rerank_enabled });
      updateRerankToggle();
      setState({ hydeEnabled: settings.hyde_enabled });
      updateHydeToggle();
      
        // 嵌入模型选择器（REQ-VEC-012）
        const modelSelect = $('embeddingModelSelect');
        if (modelSelect) {
          modelSelect.value = settings.embedding_model || 'all-MiniLM-L6-v2';
          modelSelect.onchange = onEmbeddingModelChange;
        }
      
          const licenseInfo = $('settingsLicenseInfo');
          if (get('isPro')) {
            licenseInfo.innerHTML = '<div class="flex items-center justify-between"><span class="text-accent">' + t('settings.license_pro') + '</span><button id="deactivateBtn" class="text-xs text-red-400 hover:text-red-300 border border-red-400/40 rounded px-2 py-1 transition-colors">' + t('settings.deactivate') + '</button></div>';
            $('deactivateBtn').onclick = deactivatePro;
          } else {
            licenseInfo.innerHTML = '<span class="text-slate-400">' + t('settings.license_free') + '</span>';
          }
      
          // 语言选择器
          const localeSelect = $('localeSelect');
          if (localeSelect) {
            localeSelect.value = getLocale();
            localeSelect.onchange = async () => {
              const newLocale = localeSelect.value;
              if (SUPPORTED_LOCALES.includes(newLocale) && newLocale !== getLocale()) {
              await setLocale(newLocale);
              updateProStatus();
              toast(t('settings.language_label') + ': ' + localeSelect.options[localeSelect.selectedIndex].text, 'success');
                // 重新渲染设置面板以更新文案
                await openSettings();
              }
            };
          }
      
          $('settingsModal').classList.remove('hidden');
          loadModelCacheInfo();
      
          // 渲染安全防御设置区块
          const secContainer = $('securitySettingsContainer');
          if (secContainer) {
            secContainer.innerHTML = '';
            renderSecuritySettings(secContainer);
          }
      
          // 加载监听文件夹列表（REQ-SYNC-001）
          loadWatchedFolders();
      
          // 加载本地 LLM 推理模式与模型列表（REQ-LLM-003/004）
          await loadLlmModeSetting(settings);
          await loadLocalModels();
          await loadRecommendedModels();
        } catch (err) {
          toastError(err);
        }
      }
      
      /** 关闭设置面板。 */
      function closeSettings() {
        $('settingsModal').classList.add('hidden');
      }
      
      /**
       * 加载模型缓存信息（REQ-VEC-008-AC-5）。
       */
      async function loadModelCacheInfo() {
        try {
          const info = await invoke('get_model_cache_info');
          const el = $('settingsCacheInfo');
          if (info.models.length === 0) {
            el.innerHTML = '<div class="text-slate-400">' + t('settings.no_model') + '</div>';
          } else {
            const sizeStr = formatBytes(info.total_size_bytes);
            const modelList = info.models.map((m) => `${m.name} (${formatBytes(m.size_bytes)})`).join(' · ');
            el.innerHTML = '<div class="flex justify-between"><span class="text-slate-500">' + t('settings.total_size') + '</span><span class="text-slate-200">' + sizeStr + '</span></div>' +
              '<div class="text-[11px] text-slate-500">' + modelList + '</div>';
          }
        } catch (err) {
          toastError(err);
        }
      }
      
      /**
       * 显式初始化向量化引擎（REQ-VEC-008-AC-1~4）。
       */
      async function initEmbedder() {
        try {
          toast(t('settings.downloading_model'), 'info');
          await invoke('init_embedder');
        } catch (err) {
          toastError(err);
        }
      }
      
      /**
       * 清理模型缓存（REQ-VEC-008-AC-6）。
       */
      async function clearModelCache() {
        try {
          const freed = await invoke('clear_model_cache', { modelName: null });
          toastSuccess(t('settings.cache_cleared', { size: formatBytes(freed) }));
          loadModelCacheInfo();
        } catch (err) {
          toastError(err);
        }
      }
      
      // ============================================================
      // VLM Toggle
      // ============================================================
      
      /** 更新 VLM Toggle 开关的视觉状态。 */
      function updateVlmToggle() {
        const toggle = $('vlmToggle');
        const knob = toggle.querySelector('span');
        const privacy = $('vlmPrivacy');
        const enabled = get('vlmEnabled');
        if (enabled) {
          toggle.classList.remove('bg-slate-600');
          toggle.classList.add('bg-accent');
          toggle.setAttribute('aria-checked', 'true');
          knob.classList.add('translate-x-5');
          privacy.classList.remove('hidden');
        } else {
          toggle.classList.add('bg-slate-600');
          toggle.classList.remove('bg-accent');
          toggle.setAttribute('aria-checked', 'false');
          knob.classList.remove('translate-x-5');
          privacy.classList.add('hidden');
        }
      }
      
      /** VLM Toggle 点击事件。 */
      function onVlmToggle() {
        if (get('vlmEnabled')) {
          setState({ vlmEnabled: false });
          updateVlmToggle();
          saveVlmSetting(false);
        } else {
          $('vlmConfirm').classList.remove('hidden');
        }
      }
      
      /** 隐私确认弹窗：确认开启 VLM。 */
      async function confirmVlmEnable() {
        $('vlmConfirm').classList.add('hidden');
        setState({ vlmEnabled: true });
        updateVlmToggle();
        await saveVlmSetting(true);
      }
      
      /** 隐私确认弹窗：取消。 */
      function cancelVlmEnable() {
        $('vlmConfirm').classList.add('hidden');
      }
      
      /** 持久化 VLM 开关状态到后端。 */
      async function saveVlmSetting(enabled) {
        try {
          await invoke('set_vlm_enabled', { enabled });
          toast(enabled ? t('settings.vlm_enabled') : t('settings.vlm_disabled'), 'success');
        } catch (err) {
          toastError(err);
          setState({ vlmEnabled: !enabled });
          updateVlmToggle();
        }
      }
      
      // ============================================================
      // Cross-Encoder Rerank Toggle (REQ-RAG-020)
      // ============================================================
      
      /** 更新重排序 Toggle 开关的视觉状态。 */
      function updateRerankToggle() {
        const toggle = $('rerankToggle');
        if (!toggle) return;
        const knob = toggle.querySelector('span');
        const enabled = get('rerankEnabled');
        if (enabled) {
          toggle.classList.remove('bg-slate-600');
          toggle.classList.add('bg-accent');
          toggle.setAttribute('aria-checked', 'true');
          knob.classList.add('translate-x-5');
        } else {
          toggle.classList.add('bg-slate-600');
          toggle.classList.remove('bg-accent');
          toggle.setAttribute('aria-checked', 'false');
          knob.classList.remove('translate-x-5');
        }
      }
      
      /** 重排序 Toggle 点击事件。 */
      function onRerankToggle() {
        const newEnabled = !get('rerankEnabled');
        setState({ rerankEnabled: newEnabled });
        updateRerankToggle();
        saveRerankSetting(newEnabled);
      }
      
      /** 持久化重排序开关状态到后端。 */
      async function saveRerankSetting(enabled) {
      try {
      await invoke('set_rerank_enabled', { enabled });
      toast(enabled ? t('settings.rerank_enabled') : t('settings.rerank_disabled'), 'success');
      } catch (err) {
      toastError(err);
      setState({ rerankEnabled: !enabled });
      updateRerankToggle();
      }
      }
      
      // ============================================================
      // HyDE Query Rewriting Toggle (REQ-RAG-021)
      // ============================================================
      
      /** 更新 HyDE 查询改写 Toggle 开关的视觉状态。 */
      function updateHydeToggle() {
      const toggle = $('hydeToggle');
      if (!toggle) return;
      const knob = toggle.querySelector('span');
      const enabled = get('hydeEnabled');
      if (enabled) {
      toggle.classList.remove('bg-slate-600');
      toggle.classList.add('bg-accent');
      toggle.setAttribute('aria-checked', 'true');
      knob.classList.add('translate-x-5');
      } else {
      toggle.classList.add('bg-slate-600');
      toggle.classList.remove('bg-accent');
      toggle.setAttribute('aria-checked', 'false');
      knob.classList.remove('translate-x-5');
      }
      }
      
      /** HyDE Toggle 点击事件。 */
      function onHydeToggle() {
      const newEnabled = !get('hydeEnabled');
      setState({ hydeEnabled: newEnabled });
      updateHydeToggle();
      saveHydeSetting(newEnabled);
      }
      
      /** 持久化 HyDE 查询改写开关状态到后端。 */
      async function saveHydeSetting(enabled) {
      try {
      await invoke('set_hyde_enabled', { enabled });
      toast(enabled ? t('settings.hyde_enabled') : t('settings.hyde_disabled'), 'success');
      } catch (err) {
      toastError(err);
      setState({ hydeEnabled: !enabled });
      updateHydeToggle();
      }
      }
      
      /**
       * 初始化设置面板事件绑定。
       */
      function initSettings() {
        $('settingsClose').onclick = closeSettings;
        if ($('settingsCloseBtn')) $('settingsCloseBtn').onclick = closeSettings;
        $('settingsEditLlm').onclick = () => { closeSettings(); showWizard(); };
        $('settingsInitEmbedder').onclick = initEmbedder;
        $('settingsClearCache').onclick = clearModelCache;
        $('vlmToggle').onclick = onVlmToggle;
        $('vlmConfirmOk').onclick = confirmVlmEnable;
        $('vlmConfirmCancel').onclick = cancelVlmEnable;
        if ($('vlmConfirmCloseBtn')) $('vlmConfirmCloseBtn').onclick = cancelVlmEnable;
        if ($('rerankToggle')) $('rerankToggle').onclick = onRerankToggle;
      if ($('hydeToggle')) $('hydeToggle').onclick = onHydeToggle;
        // 文件监听 + 增量同步（REQ-SYNC-001~003）
        if ($('syncAddBtn')) $('syncAddBtn').onclick = onAddWatchedFolder;
      
        // 本地 LLM 模式切换（REQ-LLM-003）
        const llmModeRadios = document.querySelectorAll('input[name="llmMode"]');
        llmModeRadios.forEach((radio) => { radio.onchange = () => onLlmModeChange(radio.value); });
        if ($('llmDownloadCancelBtn')) $('llmDownloadCancelBtn').onclick = onCancelDownload;
      
        // 注册 model_load_progress 事件监听（REQ-LLM-003 AC-4）
        registerModelLoadListener();
      }
      
      // ============================================================
      // Embedding Model Selector (REQ-VEC-012)
      // ============================================================
      
      /**
       * 嵌入模型选择器 change 事件（REQ-VEC-012）。
       *
       * 切换模型后显示「建议重建索引」提示，不自动触发重建。
       * 如果当前有已索引文档，显示警告。
       */
      async function onEmbeddingModelChange() {
        const select = $('embeddingModelSelect');
        if (!select) return;
        const newModel = select.value;
        try {
          await embedModelApi.setModel(newModel);
          // 显示重建索引提示
          const warning = $('embeddingModelWarning');
          if (warning) {
            warning.classList.remove('hidden');
          }
          toast(t('settings.embedding_model_switched', { model: newModel }), 'success');
          // 刷新缓存信息（新模型可能已缓存）
          loadModelCacheInfo();
        } catch (err) {
          toastError(err);
          // 恢复原选择
          await openSettings();
        }
      }
      
      // ============================================================
      // File Watcher + Incremental Sync (REQ-SYNC-001~003)
      // ============================================================
      
      /**
       * 添加监听文件夹（REQ-SYNC-001 AC-2）。
       *
       * 弹出系统文件夹选择器，选择后添加到监听列表并触发首次同步。
       */
      async function onAddWatchedFolder() {
        try {
          const selected = await window.__TAURI__.dialog.open({
            directory: true,
            multiple: false,
            title: t('settings.sync_select_folder'),
          });
          if (!selected) return;
          const folderPath = typeof selected === 'string' ? selected : selected[0];
          if (!folderPath) return;
      
          toast(t('settings.sync_starting'), 'info');
          const result = await syncApi.add(folderPath);
          toast(
            t('settings.sync_complete', {
              added: result.added,
              updated: result.updated,
              deleted: result.deleted,
            }),
            'success'
          );
          await loadWatchedFolders();
        } catch (err) {
          toastError(err);
        }
      }
      
      /**
       * 移除监听文件夹（REQ-SYNC-001 AC-4）。
       *
       * 仅停止监听，不删除已导入的文档。
       *
       * @param {string} folderPath - 监听文件夹路径
       */
      async function onRemoveWatchedFolder(folderPath) {
        try {
          await syncApi.remove(folderPath);
          toast(t('settings.sync_removed'), 'success');
          await loadWatchedFolders();
        } catch (err) {
          toastError(err);
        }
      }
      // 暴露为全局函数（内联 onclick 需要）
      window.onRemoveWatchedFolder = onRemoveWatchedFolder;
      
      /**
       * 加载并渲染监听文件夹列表（REQ-SYNC-001 AC-3）。
       *
       * 每个条目显示路径、同步状态与最后同步时间。
       */
      async function loadWatchedFolders() {
        const container = $('syncFolderList');
        if (!container) return;
      
        try {
          const folders = await syncApi.list();
          if (folders.length === 0) {
            container.innerHTML = `<p class="text-sm text-slate-500 py-2">${t('settings.sync_empty')}</p>`;
            return;
          }
      
          container.innerHTML = folders
            .map(
              (f) => `
            <div class="flex items-center justify-between gap-2 py-2 px-3 rounded-lg bg-slate-800/50">
              <div class="flex-1 min-w-0">
                <p class="text-sm text-slate-200 truncate">${f.name}</p>
                <p class="text-xs text-slate-500 truncate">${f.path}</p>
                <p class="text-xs ${f.sync_status === 'idle' ? 'text-emerald-400' : 'text-slate-500'}">
                  ${f.sync_status === 'idle' ? t('settings.sync_status_idle') : t('settings.sync_status_stopped')}
                  ${f.last_synced_at ? ' · ' + new Date(f.last_synced_at * 1000).toLocaleString() : ''}
                </p>
              </div>
              <button class="shrink-0 px-2 py-1 text-xs rounded-lg bg-red-500/15 text-red-300 border border-red-400/40 hover:bg-red-500/25 transition-colors"
                onclick="onRemoveWatchedFolder('${f.path.replace(/'/g, "\\'")}')"
              >${t('settings.sync_remove')}</button>
            </div>`
            )
            .join('');
        } catch (err) {
          container.innerHTML = `<p class="text-sm text-red-400 py-2">${t('settings.sync_load_error')}</p>`;
        }
      }
      
      // ============================================================
      // Local LLM Model Management (REQ-LLM-003/004)
      // ============================================================
      
      /** 当前选中的本地模型文件名（从 settings.local_model 恢复） */
      let _selectedLocalModel = '';
      
      /** 下载进度事件取消监听函数 */
      let _unlistenDownloadProgress = null;
      
      /**
       * 格式化模型文件大小（支持 GB 单位，GGUF 模型通常 2~5GB）。
       * @param {number} bytes - 字节数
       * @returns {string} 人类可读的大小字符串
       */
      function formatModelSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB';
      }
      
      /**
       * 从 get_settings 返回的 llm_mode / local_model 字段恢复 UI 状态。
       * @param {Object} settings - get_settings 命令返回的设置对象
       */
      async function loadLlmModeSetting(settings) {
        const mode = settings.llm_mode || 'remote';
        _selectedLocalModel = settings.local_model || '';
        const radioRemote = $('llmModeRemote');
        const radioLocal = $('llmModeLocal');
        if (radioRemote && radioLocal) {
          if (mode === 'local') {
            radioLocal.checked = true;
          } else {
            radioRemote.checked = true;
          }
        }
      }
      
      /**
       * 切换 LLM 推理模式（REQ-LLM-003 AC-4）。
       * Free 用户切换到 local 时被拦截并提示升级 Pro。
       * @param {string} mode - 'remote' 或 'local'
       */
      async function onLlmModeChange(mode) {
        try {
          if (mode === 'local' && !get('isPro')) {
            toast(t('settings.llm_mode_pro_required'), 'info');
            $('llmModeRemote').checked = true;
            return;
          }
          await localLlmApi.setMode(mode);
          toast(
            mode === 'local'
              ? t('settings.llm_mode_switched_local')
              : t('settings.llm_mode_switched_remote'),
            'success'
          );
        } catch (err) {
          toastError(err);
          // 失败时恢复 radio 到后端实际状态
          try {
            const actual = await localLlmApi.getMode();
            if (actual === 'local') {
              $('llmModeLocal').checked = true;
            } else {
              $('llmModeRemote').checked = true;
            }
          } catch (_) {
            $('llmModeRemote').checked = true;
          }
        }
      }
      
      /**
       * 加载并渲染已下载的本地模型列表（REQ-LLM-004 AC-1）。
       * 每个条目显示架构/参数量/量化格式/文件大小，以及「使用」/「删除」按钮。
       */
      async function loadLocalModels() {
        const container = $('localModelsList');
        if (!container) return;
        try {
          const models = await localLlmApi.listModels();
          if (models.length === 0) {
            container.innerHTML = `<p class="text-xs text-text-quaternary py-2">${t('settings.llm_local_no_models')}</p>`;
            return;
          }
          container.innerHTML = models
            .map((m) => {
              const isSelected = m.filename === _selectedLocalModel;
              const displayName = `${m.architecture} ${m.param_size}`;
              const escapedFilename = m.filename.replace(/'/g, "\\'");
              const escapedName = displayName.replace(/'/g, "\\'");
              return `
              <div class="flex items-center justify-between gap-2 py-2 px-2 rounded-lg ${isSelected ? 'bg-accent/10' : 'hover:bg-white/5'}">
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-text-primary truncate">${displayName}</div>
                  <div class="text-[11px] text-text-quaternary">${m.quantization} · ${formatModelSize(m.size_bytes)}</div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  ${isSelected
                    ? `<span class="px-2 py-1 text-[11px] rounded-lg bg-accent/15 text-accent border border-accent/30">${t('settings.llm_local_using')}</span>`
                    : `<button class="px-2 py-1 text-[11px] rounded-lg bg-accent/15 text-accent border border-accent/30 hover:bg-accent/25 transition-colors"
                        onclick="selectLocalModel('${escapedFilename}', '${escapedName}')">${t('settings.llm_local_use')}</button>`
                  }
                  <button class="px-2 py-1 text-[11px] rounded-lg bg-red-500/15 text-red-300 border border-red-400/40 hover:bg-red-500/25 transition-colors"
                    onclick="deleteLocalModel('${escapedFilename}', '${escapedName}', ${m.size_bytes})">${t('settings.llm_local_delete')}</button>
                </div>
              </div>`;
            })
            .join('');
        } catch (err) {
          container.innerHTML = `<p class="text-xs text-red-400 py-2">${t('settings.llm_local_load_failed')}</p>`;
        }
      }
      
      /**
       * 加载并渲染推荐模型列表（REQ-LLM-004 AC-6）。
       * 每个条目显示名称/量化格式/大小/描述，以及「下载」按钮。
       */
      async function loadRecommendedModels() {
        const container = $('recommendedModelsList');
        if (!container) return;
        try {
          const models = await localLlmApi.getRecommended();
          if (models.length === 0) return;
          container.innerHTML = models
            .map((m) => {
              const filename = m.url.split('/').pop() || `${m.name}.gguf`;
              const escapedUrl = m.url.replace(/'/g, "\\'");
              const escapedFilename = filename.replace(/'/g, "\\'");
              const escapedName = m.name.replace(/'/g, "\\'");
              return `
              <div class="flex items-center justify-between gap-2 py-2 px-2 rounded-lg hover:bg-white/5">
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-text-primary truncate">${m.name}</div>
                  <div class="text-[11px] text-text-quaternary">${m.quantization} · ${m.size_gb.toFixed(1)} GB · ${m.description}</div>
                </div>
                <button class="shrink-0 px-2 py-1 text-[11px] rounded-lg bg-accent/15 text-accent border border-accent/30 hover:bg-accent/25 transition-colors"
                  onclick="downloadLocalModel('${escapedUrl}', '${escapedFilename}', '${escapedName}')">${t('settings.llm_local_download')}</button>
              </div>`;
            })
            .join('');
        } catch (err) {
          // 推荐模型加载失败不阻塞设置面板
        }
      }
      
      /**
       * 下载本地 GGUF 模型文件（REQ-LLM-004 AC-2）。
       *
       * 显示进度条，监听 `model_download_progress` 事件更新进度。
       * 下载完成后自动刷新已下载模型列表。
       *
       * @param {string} url - 下载 URL（HuggingFace GGUF）
       * @param {string} filename - 目标文件名
       * @param {string} displayName - 用于 UI 显示的模型名称
       */
      async function downloadLocalModel(url, filename, displayName) {
        const progressEl = $('llmDownloadProgress');
        if (!progressEl) return;
      
        // 显示进度条
        progressEl.classList.remove('hidden');
        $('llmDownloadFilename').textContent = displayName || filename;
        $('llmDownloadBar').style.width = '0%';
        $('llmDownloadPct').textContent = '0%';
        $('llmDownloadSize').textContent = '— / —';
      
        // 清理旧的进度监听器
        if (_unlistenDownloadProgress) {
          _unlistenDownloadProgress();
          _unlistenDownloadProgress = null;
        }
      
        // 注册进度事件监听
        try {

            const p = event.payload;

            const bar = $('llmDownloadBar');

          });

          // 测试环境或事件系统不可用时静默降级
        }

          await localLlmApi.download(url, filename);
          toastSuccess(t('settings.llm_local_download_complete', { name: displayName || filename }));
          await loadLocalModels();

          toastError(err);

       * - status="loading" → 显示加载中 toast

       * - status="error" → 显示加载失败 toast

      /**
       * 检查文件大小并过滤（REQ-ING-013）。
       * - >500MB：直接拒绝，toast 提示
       * - >100MB：弹出警告对话框，用户确认后保留
       * - <=100MB：正常导入
       *
       * @param {string[]} paths - 原始文件路径数组
       * @returns {Promise<string[]>} 过滤后的文件路径数组（用户确认导入的文件）
       */
      async function checkFileSizes(paths) {
        try {
          const sizes = await invoke('get_file_sizes', { paths });
          const [warnThreshold, hardLimit] = await invoke('get_file_size_limits');
      
          const normal = [];
          const warning = [];
          const rejected = [];
      
          for (const [path, size] of sizes) {
            if (size > hardLimit) {
              rejected.push({ path, size });
            } else if (size > warnThreshold) {
              warning.push({ path, size });
            } else {
              normal.push(path);
            }
          }
      
          // 拒绝的文件（>500MB）：toast 提示
          for (const { path, size } of rejected) {
            const name = path.split('/').pop() || path;
            toastError(t('import.file_too_large', { name, size: formatBytes(size), limit: formatBytes(hardLimit) }));
          }
      
          // 警告的文件（>100MB）：弹确认对话框
          if (warning.length > 0) {
            const confirmed = await showFileSizeWarning(warning);
            if (confirmed) {
              normal.push(...warning.map((w) => w.path));
            }
          }
      
          return normal;
        } catch (err) {
          // get_file_sizes 不可用时，回退为不检查（兼容旧环境）
          console.warn('[import] get_file_sizes failed, skipping size check:', err);
          return paths;
        }
      }
      
      /**
       * 显示文件大小警告对话框（REQ-ING-013 AC-1）。
       * @param {Array<{path: string, size: number}>} warningFiles - 超过警告阈值的文件列表
       * @returns {Promise<boolean>} 用户是否确认导入
       */
      function showFileSizeWarning(warningFiles) {
        return new Promise((resolve) => {
          const dialog = $('fileSizeWarningDialog');
          if (!dialog) { resolve(true); return; }
      
          // 填充文件列表
          const listEl = $('fileSizeWarningList');
          if (listEl) {
            listEl.innerHTML = warningFiles
              .map((f) => {
                const name = f.path.split('/').pop() || f.path;
                return `<div class="flex justify-between text-xs py-1"><span class="truncate text-text-secondary">${name}</span><span class="text-amber-400 shrink-0 ml-2">${formatBytes(f.size)}</span></div>`;
              })
              .join('');
          }
      
          dialog.classList.remove('hidden');
      
          // 确认按钮
          const okBtn = $('fileSizeWarningOk');
          const cancelBtn = $('fileSizeWarningCancel');
      
          const cleanup = () => {
            dialog.classList.add('hidden');
            okBtn.onclick = null;
            cancelBtn.onclick = null;
          };
      
          okBtn.onclick = () => { cleanup(); resolve(true); };
          cancelBtn.onclick = () => { cleanup(); resolve(false); };
        });
      }
      
      /**
       * 批量导入文件路径：调用 import_files，成功刷新列表；配额/PDF 触顶时弹出付费墙。
       *
       * 错误处理策略（不依赖 invoke 全局包装器，确保错误一定有用户可见反馈）：
       * - PRO_REQUIRED / LIMIT_REACHED → 弹出付费墙 Modal
       * - 不支持的格式 → toast 提示
       * - 其他错误 → toast 提示原始消息
       *
       * @param {string[]} paths - 原始文件路径数组
       * @param {() => Promise} [onImportDone] - 导入成功后的回调（通常为 loadDocuments）
       */
      async function importPaths(paths, onImportDone) {
        if (!paths || paths.length === 0) return;
      
        // REQ-ING-013：导入前检查文件大小
        const filteredPaths = await checkFileSizes(paths);
        if (filteredPaths.length === 0) {
          // 所有文件都被拒绝或用户取消了警告
          return;
        }
      
        showImportProgress(filteredPaths.length);
        try {
          const names = await invoke('import_files', { paths: filteredPaths });
          if (names.length > 0) {
            toast(t('import.import_complete', { names: names.join('、') }), 'success');
          }
          if (onImportDone) await onImportDone();
        } catch (err) {
          const msg = String(err);
          if (msg.includes('PRO_REQUIRED') || msg.includes('LIMIT_REACHED')) {
            // PDF 付费门 / 配额触顶 → 弹出付费墙
            const reason = msg.split(':').slice(1).join(':').trim() || t('paywall.reason_default');
            showPaywall(reason);
          } else {
            // 其他错误（格式不支持、路径非法等）→ toast 提示
            toastError(msg);
          }
        } finally {
          hideImportProgress();
        }
      }
      
      /**
       * 初始化拖拽导入事件（REQ-UI-004：Tauri 原生拖拽事件）。

      // 模块: conv-nav.js
      // ============================================================
      /**
       * EchoMind 对话导航条模块 — DeepSeek 风格右侧导航。
       *
       * 聊天区右侧细长导航条，每个 Q&A 对应一段可点击的条段。
       * - 悬停弹出问题摘要 tooltip（独立 fixed 元素，不受父元素变形影响）
       * - 点击跳转到对应消息
       * - 高亮当前可见的 Q&A 段
       * - 使用 MutationObserver 自动检测聊天区变化
       *
       * 设计灵感：chat.deepseek.com 右侧对话导航
       */
      
      /** @type {Array<{element: HTMLElement, segment: HTMLElement}>} */
      let _navItems = [];
      
      /** @type {IntersectionObserver|null} */
      let _observer = null;
      
      /** 当前高亮的段索引 */
      let _activeIndex = -1;
      
      /** MutationObserver 实例 */
      let _mutationObserver = null;
      
      /** 防抖定时器 */
      let _updateTimer = null;
      
      /** 独立 tooltip 元素（不挂载在 segment 内部，避免变形） */
      let _tooltipEl = null;
      
      /**
       * 创建独立的 tooltip 元素（全局唯一，挂在 body 下）。
       */
      function _ensureTooltip() {
        if (_tooltipEl && document.body.contains(_tooltipEl)) return;
        _tooltipEl = document.createElement('div');
        _tooltipEl.className = 'conv-nav-tooltip';
        _tooltipEl.style.display = 'none';
        document.body.appendChild(_tooltipEl);
      }
      
      /**
       * 显示 tooltip：根据 segment 的屏幕位置，将 tooltip 定位在其左侧。
       * @param {HTMLElement} segment - 被悬停的导航段
       * @param {string} text - 要显示的文本
       */
      function _showTooltip(segment, text) {
        _ensureTooltip();
        const rect = segment.getBoundingClientRect();
        _tooltipEl.textContent = text;
        _tooltipEl.style.display = 'block';
        // 定位：tooltip 右边缘紧贴 segment 左侧，垂直居中
        const tipRect = _tooltipEl.getBoundingClientRect();
        _tooltipEl.style.left = `${rect.left - tipRect.width - 8}px`;
        _tooltipEl.style.top = `${rect.top + rect.height / 2 - tipRect.height / 2}px`;
        _tooltipEl.style.opacity = '1';
      }
      
      /** 隐藏 tooltip。 */
      function _hideTooltip() {
        if (!_tooltipEl) return;
        _tooltipEl.style.opacity = '0';
        _tooltipEl.style.display = 'none';
      }
      
      /**
       * 扫描聊天区中的 Q&A 消息块，构建导航条段。
       * 每个 user 消息块（含 justify-end 的子元素）对应一个导航段。
       */
      function _scanAndBuildNav() {
        const nav = $('convNav');
        const chatArea = $('chatArea');
        if (!nav || !chatArea) return;
      
        // 清空旧数据
        nav.innerHTML = '';
        _navItems = [];
        _activeIndex = -1;
      
        // 查找所有消息块（mb-5 message-in 是 appendBlock 创建的类名）
        const blocks = chatArea.querySelectorAll('.message-in');
      
        // 筛选出 user 消息块（包含 justify-end 子元素的是 user 消息）
        const userBlocks = [];
        blocks.forEach((block) => {
          const userBubble = block.querySelector('.flex.justify-end');
          if (userBubble) {
            userBlocks.push({ block, bubble: userBubble });
          }
        });
      
        if (userBlocks.length === 0) {
          nav.classList.remove('has-items');
          return;
        }
      
        nav.classList.add('has-items');
      
        // 为每个 user 消息创建一个导航段
        userBlocks.forEach((item, idx) => {
          const segment = document.createElement('div');
          segment.className = 'conv-nav-segment';
          segment.dataset.idx = String(idx);
      
          // 提取问题文本（截断到 60 字符）
          const questionText = item.bubble.textContent?.trim().slice(0, 60) || `Q${idx + 1}`;
      
          // 悬停时显示独立 tooltip（不用子元素，避免继承变形）
          segment.addEventListener('mouseenter', () => _showTooltip(segment, questionText));
          segment.addEventListener('mouseleave', _hideTooltip);
      
          // 点击跳转
          segment.addEventListener('click', () => {
            item.block.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
      
          nav.appendChild(segment);
          _navItems.push({ element: item.block, segment });
        });
      
        // 设置 IntersectionObserver 追踪当前可见的 Q&A
        _setupObserver();
      }
      
      /**
       * 设置 IntersectionObserver 追踪当前可见的消息块。
       */
      function _setupObserver() {
        if (_observer) {
          _observer.disconnect();
        }
      
        const chatArea = $('chatArea');
        if (!chatArea || _navItems.length === 0) return;
      
        _observer = new IntersectionObserver(
          () => {
            // 找到最顶部可见的条目
            let topVisibleIdx = -1;
            let topVisibleTop = Infinity;
      
            _navItems.forEach((item, idx) => {
              const rect = item.element.getBoundingClientRect();
              const chatRect = chatArea.getBoundingClientRect();
              // 判断元素是否在聊天区可视范围内
              if (rect.bottom > chatRect.top && rect.top < chatRect.bottom) {
                if (rect.top < topVisibleTop) {
                  topVisibleTop = rect.top;
                  topVisibleIdx = idx;
                }
              }
            });
      
            if (topVisibleIdx !== -1 && topVisibleIdx !== _activeIndex) {
              _setActive(topVisibleIdx);
            }
          },
          { root: chatArea, threshold: [0, 0.1, 0.5, 1.0] },
        );
      
        // 观察所有导航项对应的元素
        _navItems.forEach((item) => {
          _observer.observe(item.element);
        });
      }
      
      /**
       * 设置当前高亮的导航段。
       * @param {number} idx - 导航段索引
       */
      function _setActive(idx) {
        _activeIndex = idx;
        _navItems.forEach((item, i) => {
          if (i === idx) {
            item.segment.classList.add('active');
          } else {
            item.segment.classList.remove('active');
          }
        });
      }
      
      /**
       * 初始化对话导航条。
       * 使用 MutationObserver 监听聊天区变化，自动更新导航条。
       */
      function initConvNav() {
        const chatArea = $('chatArea');
        if (!chatArea) return;
      
        // 创建独立 tooltip 元素
        _ensureTooltip();
      
        // 初始构建
        _scanAndBuildNav();
      
        // 监听聊天区 DOM 变化（防抖 200ms）
        _mutationObserver = new MutationObserver(() => {
          clearTimeout(_updateTimer);
          _updateTimer = setTimeout(() => {
            _scanAndBuildNav();
          }, 200);
        });
      
        _mutationObserver.observe(chatArea, {
          childList: true,
          subtree: false,
        });
      }
      
      /**
       * 销毁对话导航条（清理观察者和 tooltip）。
       */
      function destroyConvNav() {
        if (_observer) {
          _observer.disconnect();
          _observer = null;
        }
        if (_mutationObserver) {
          _mutationObserver.disconnect();
          _mutationObserver = null;
        }
        if (_tooltipEl) {
          _tooltipEl.remove();
          _tooltipEl = null;
        }
        _navItems = [];
        _activeIndex = -1;
      }

            <p class="lock-hint" data-i18n="security.lock_hint">密码仅用于本地数据库解密，不会发送到任何服务器</p>
          </div>
        `;
        document.body.appendChild(_lockOverlayEl);
      
        _lockPasswordInputEl = _lockOverlayEl.querySelector('#lockPasswordInput');
        _lockErrorEl = _lockOverlayEl.querySelector('#lockError');
        _lockUnlockBtnEl = _lockOverlayEl.querySelector('#lockUnlockBtn');
      
        // 解锁按钮点击
        _lockUnlockBtnEl.addEventListener('click', handleUnlock);
      
        // Enter 键提交
        _lockPasswordInputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            handleUnlock();
          }
        });
      }
      
      /**
       * 显示锁屏遮罩。
       */
      function showLockOverlay() {
        ensureLockOverlay();
        _lockOverlayEl.classList.add('lock-overlay--visible');
        // 自动聚焦密码输入框
        setTimeout(() => {
          _lockPasswordInputEl?.focus();
        }, 100);
        // 清除上一次的错误信息
        if (_lockErrorEl) _lockErrorEl.textContent = '';
        if (_lockPasswordInputEl) _lockPasswordInputEl.value = '';
      }
      
      /**
       * 隐藏锁屏遮罩。
       */
      function hideLockOverlay() {
        if (_lockOverlayEl) {
          _lockOverlayEl.classList.remove('lock-overlay--visible');
        }
      }
      
      /**
       * 处理解锁请求。
       */
      async function handleUnlock() {
        const password = _lockPasswordInputEl?.value?.trim();
        if (!password) {
          if (_lockErrorEl) _lockErrorEl.textContent = t('security.error_no_password', '请输入密码');
          return;
        }
      
        _lockUnlockBtnEl.disabled = true;
        _lockUnlockBtnEl.textContent = t('security.unlocking', '解锁中…');
      
        try {
          const result = await securityApi.unlock(password);
          if (result.success) {
            setState({ securityState: 'encrypted_unlocked' });
            hideLockOverlay();
            showToast(t('security.unlocked', '已解锁'), 'success');
          } else {
            // 解锁失败（密码错误或暴力破解锁定）
            const errorMsg = result.message || t('security.unlock_failed', '解锁失败');
            const waitSecs = result.wait_seconds || 0;
            if (_lockErrorEl) {
              _lockErrorEl.textContent = waitSecs > 0
                ? `${errorMsg}（${t('security.please_wait', '请等待')} ${waitSecs}s）`
                : errorMsg;
            }
          }
        } catch (err) {
          if (_lockErrorEl) _lockErrorEl.textContent = String(err);
        } finally {
          _lockUnlockBtnEl.disabled = false;
          _lockUnlockBtnEl.textContent = t('security.unlock', '解锁');
        }
      }
      
      /**
       * 锁定应用（手动或自动）。
       */
      async function lockApp() {
        try {
          await securityApi.lock();
          setState({ securityState: 'locked' });
          showLockOverlay();
        } catch (err) {
          showToast(t('security.lock_failed', '锁定失败') + ': ' + String(err), 'error');
        }
      }

      /**
       * 从后端同步安全状态到前端。
       * 在应用启动时调用。
       */
      async function syncSecurityStatus() {
        try {
          const status = await securityApi.getStatus();
          setState({
            securityState: status.state || 'unencrypted',
            piiDetectionEnabled: status.pii_detection_enabled || false,
            autoLockTimeout: status.auto_lock_timeout || 0,
          });
      
          // 如果已锁定，显示锁屏遮罩
          if (status.state === 'locked') {
            showLockOverlay();
          }
        } catch (err) {
          // 安全状态获取失败（可能后端未启用），静默降级
          console.warn('Security status sync failed:', err);
        }
      }
      
      /**
       * 监听 security-state-changed Tauri 事件，实时同步锁屏状态。
       */
      async function listenSecurityEvents() {
        try {
          const { listen } = await import('./ipc.js');
          await listen('security-state-changed', (event) => {
            const newState = event.payload?.state;
            if (newState) {
              setState({ securityState: newState });
              if (newState === 'locked') {
                showLockOverlay();
              } else if (newState === 'encrypted_unlocked') {
                hideLockOverlay();
              }
            }
          });
        } catch (_) {
          // 事件监听失败，静默降级
        }
      }
      
      /**

       * 在鼠标移动、键盘按下等事件中调用。

      let _activityThrottle = 0;
      function recordActivity() {
        const now = Date.now();
        if (now - _activityThrottle < 5000) return; // 5 秒内不重复上报
        _activityThrottle = now;
        // 异步通知后端，不等待结果
        securityApi.checkStatus().catch(() => {});

              <button class="btn btn-primary" id="encConfirmBtn" data-i18n="security.encrypt_confirm">确认加密</button>
            </div>
          </div>
        `;
        document.body.appendChild(dialog);
      
        const pwdInput = dialog.querySelector('#encPwdInput');
        const pwdConfirm = dialog.querySelector('#encPwdConfirmInput');
        const strengthEl = dialog.querySelector('#encPwdStrength');
        const errorEl = dialog.querySelector('#encError');
        const cancelBtn = dialog.querySelector('#encCancelBtn');
        const confirmBtn = dialog.querySelector('#encConfirmBtn');
      
        // 密码强度实时检测
        pwdInput.addEventListener('input', () => {
          const pwd = pwdInput.value;
          if (!pwd) {
            strengthEl.textContent = '';
            return;
          }
          const strength = assessPasswordStrength(pwd);
          strengthEl.textContent = strength.label;
          strengthEl.className = `pwd-strength pwd-strength--${strength.level}`;
        });
      
        // 取消
        cancelBtn.addEventListener('click', () => dialog.remove());
      
        // 确认加密
        confirmBtn.addEventListener('click', async () => {
          const pwd = pwdInput.value;
          const confirm = pwdConfirm.value;
      
          if (!pwd || pwd.length < 8) {
            errorEl.textContent = t('security.error_pwd_too_short', '密码至少 8 个字符');
            return;
          }
          if (pwd !== confirm) {
            errorEl.textContent = t('security.error_pwd_mismatch', '两次输入的密码不一致');
            return;
          }
      
          confirmBtn.disabled = true;
          confirmBtn.textContent = t('security.encrypting', '加密中…');
      
          try {
            const result = await securityApi.encrypt(pwd);
            if (result.success) {
              setState({ securityState: 'encrypted_unlocked' });
              showToast(t('security.encrypt_success', '数据库已加密'), 'success');
              dialog.remove();

            }
          } catch (err) {
            errorEl.textContent = String(err);
          } finally {
            confirmBtn.disabled = false;
            confirmBtn.textContent = t('security.encrypt_confirm', '确认加密');
          }
        });
      
        // Esc 关闭
        dialog.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') dialog.remove();
        });
      
        pwdInput.focus();

      /**
       * 简易密码强度评估（前端预检，后端有 Argon2id 正式验证）。
       * @param {string} pwd
       * @returns {{level: string, label: string}}
       */
      function assessPasswordStrength(pwd) {
        let score = 0;
        if (pwd.length >= 8) score++;
        if (pwd.length >= 12) score++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
        if (/\d/.test(pwd)) score++;
        if (/[^a-zA-Z0-9]/.test(pwd)) score++;
      
        if (score <= 2) return { level: 'weak', label: t('security.pwd_weak', '弱') };
        if (score <= 3) return { level: 'medium', label: t('security.pwd_medium', '中') };
        if (score <= 4) return { level: 'good', label: t('security.pwd_good', '良好') };
        return { level: 'strong', label: t('security.pwd_strong', '强') };
      }

      /**
       * 初始化安全模块。
       * 在应用启动时调用。
       */
      async function initSecurity() {
        // 1. 同步后端安全状态
        await syncSecurityStatus();
      
        // 2. 监听安全事件
        await listenSecurityEvents();
      
        // 3. 订阅状态变化，自动显示/隐藏锁屏遮罩
        subscribe('securityState', (newState) => {
          if (newState === 'locked') {
            showLockOverlay();
          } else if (newState === 'encrypted_unlocked') {
            hideLockOverlay();
          }
        });
      
        // 4. 绑定全局用户活动监听（重置自动锁屏计时器）
        let activityTimer = null;
        const activityHandler = () => {
          if (activityTimer) return;
          activityTimer = setTimeout(() => {
            activityTimer = null;
          }, 10000);
          recordActivity();
        };
        document.addEventListener('mousemove', activityHandler, { passive: true });
        document.addEventListener('keydown', activityHandler, { passive: true });
      }

      /**
       * 返回安全相关的命令面板条目。
       * @returns {Array<{id: string, label: string, group: string, action: Function}>}

      function getSecurityCommands() {
        const state = getState();
        const commands = [];
      
        if (isEncrypted() && !isLocked()) {
          commands.push({
            id: 'lock-app',
            label: t('security.cmd_lock', '🔒 锁定应用'),
            group: 'security',
            action: lockApp,
          });
        }

      async function newChat() {

       * @param {string} id - 会话 ID
       */
      async function loadConversation(id) {
        if (get('streaming')) { toast(t('chat.streaming_hint'), 'info'); return; }
        const messages = await invoke('get_messages', { conversationId: id });
        setState({ currentConversationId: id, history: messages, isNewConversation: false });
        $('chatArea').innerHTML = '';
        if (messages.length === 0) {
          resetChatArea(t('chat.empty_messages_title'), t('chat.empty_messages_desc'));
        }
        let lastUserMsg = '';
        for (const m of messages) {
          if (m.role === 'user') {
            lastUserMsg = m.content;
            appendUserBlock(m.content);
          } else {
            const el = appendBlock('assistant');
            // REQ-RAG-012 AC-4：存储对应的用户问题，供「重新生成」使用
            el.dataset.query = lastUserMsg;
            setState({ currentAssistantEl: el });
            const thinking = el.querySelector('.thinking-indicator');
            if (thinking) thinking.remove();
            el.querySelector('.md').classList.remove('hidden');
            setState({ currentRawMarkdown: m.content });
            if (m.sources && m.sources.length > 0) renderSources(m.sources);
            const mdEl = el.querySelector('.md');
            renderMarkdown(mdEl, get('currentRawMarkdown'), get('lastSources'));
            await renderRichContent(mdEl);
            showMsgActions(el, m.content, 'assistant');
          }

        setState({ currentAssistantEl: null, currentRawMarkdown: '' });
        scrollToBottom();
        await loadConversations();

      /**
       * 计算会话所属时间分组的标签 key。
       *
       * 分组规则（按时间从近到远）：
       *   今天 → 昨天 → 一周内 → 一个月内 → 按月份（YYYY-MM）
       *
       * @param {number} createdAt - Unix 秒级时间戳
       * @returns {string} i18n key 前缀（如 'time.today'）或月份字符串
       */
      function getConvTimeBucket(createdAt) {
        const now = new Date();
        const conv = new Date(createdAt * 1000);
      
        // 今天：同一天
        if (now.getFullYear() === conv.getFullYear() &&
            now.getMonth() === conv.getMonth() &&
            now.getDate() === conv.getDate()) {
          return 'time.today';
        }
      
        // 昨天：当前日期 -1
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        if (yesterday.getFullYear() === conv.getFullYear() &&
            yesterday.getMonth() === conv.getMonth() &&
            yesterday.getDate() === conv.getDate()) {
          return 'time.yesterday';
        }
      
        // 前天：当前日期 -2
        const dayBefore = new Date(now);
        dayBefore.setDate(now.getDate() - 2);
        if (dayBefore.getFullYear() === conv.getFullYear() &&
            dayBefore.getMonth() === conv.getMonth() &&
            dayBefore.getDate() === conv.getDate()) {
          return 'time.day_before';
        }
      
        // 一周内：7 天内（但不是今天/昨天/前天）
        const weekAgo = new Date(now);
        weekAgo.setDate(now.getDate() - 7);
        if (conv >= weekAgo) {
          return 'time.within_week';
        }
      
        // 一个月内：30 天内（但不在一周内）
        const monthAgo = new Date(now);
        monthAgo.setDate(now.getDate() - 30);
        if (conv >= monthAgo) {
          return 'time.within_month';
        }
      
        // 更早：按月份分组（YYYY-MM）
        const year = conv.getFullYear();
        const month = String(conv.getMonth() + 1).padStart(2, '0');
        return `month:${year}-${month}`;
      }
      
      /**
       * 获取时间分组的显示文案。
       * @param {string} bucket - getConvTimeBucket 返回的分组标识
       * @returns {string} 本地化的分组标签
       */
      function getConvBucketLabel(bucket) {
        if (bucket.startsWith('month:')) {
          // 月份格式：从 i18n 模板渲染
          const ym = bucket.slice(6); // "2026-06"
          const [year, month] = ym.split('-');
          return t('time.month_format', { year, month });
        }
        return t(bucket);
      }
      
      /**
       * 拉取会话列表并渲染到侧栏，按时间分组（今天/昨天/一周内/一个月内/月份），
       * 高亮当前会话。支持搜索框过滤。
       */
      async function loadConversations() {
        const list = await invoke('get_conversations', { workspaceId: WORKSPACE });
        const box = $('convList');
        box.innerHTML = '';
      
        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'px-3 py-4 text-center text-[11px] text-slate-500';
          empty.textContent = t('chat.empty_messages_desc');
          box.appendChild(empty);
          return;
        }
      
        // 新建会话不显示在列表中（尚未持久化）
        const filtered = get('isNewConversation')
          ? list.filter(c => c.id !== get('currentConversationId'))
          : list;
      
        // 按时间分组（保持倒序，因为后端已按 created_at 倒序返回）
        const groups = new Map();
        for (const c of filtered) {
          const bucket = getConvTimeBucket(c.created_at);
          if (!groups.has(bucket)) groups.set(bucket, []);
          groups.get(bucket).push(c);
        }
      
        // 渲染每个分组
        for (const [bucket, convs] of groups) {
          // 分组头（sticky）
          const header = document.createElement('div');
          header.className = 'conv-group-header';
          header.textContent = getConvBucketLabel(bucket);
          box.appendChild(header);
      
          // 分组下的会话条目
          for (const c of convs) {
            const item = document.createElement('div');
            const active = c.id === get('currentConversationId');
            item.className = `group flex items-center justify-between px-3 py-2.5 rounded-xl text-sm cursor-pointer ${active ? 'bg-accent/15 text-accent' : 'text-slate-300 hover:bg-white/5'}`;
            const title = document.createElement('span');
            title.className = 'truncate';
            title.textContent = c.title;
            const del = document.createElement('button');
            del.className = 'invisible group-hover:visible text-slate-500 hover:text-red-400 ml-2 shrink-0 px-1';
            del.textContent = '×';
            del.title = t('chat.delete_conversation');
            del.onclick = async (ev) => { ev.stopPropagation(); await removeConversation(c.id); };
            item.appendChild(title);
            item.appendChild(del);
            item.onclick = () => loadConversation(c.id);
            box.appendChild(item);
          }
        }
      }

      /**
       * 初始化全屏检测：监听窗口尺寸变化，检测 macOS 全屏状态。
       * 全屏时 traffic lights 消失 → 添加 .topbar-fs 类 → padding-left 从 78px 缩到 8px。
       * 退出全屏 → 移除 .topbar-fs 类 → 恢复 78px padding。
       * 对 Tauri 运行时不可用的环境（E2E 测试）静默降级。
       */
      function initFullscreenDetection() {
        const topBar = $('topBar');
        if (!topBar) return;
      
        /** 更新 topBar 的全屏样式类 */
        async function updateFullscreenClass() {
          try {
            const tauriWindow = window.__TAURI__?.window;
            if (!tauriWindow || !tauriWindow.getCurrentWindow) return;
            const win = tauriWindow.getCurrentWindow();
            if (!win || typeof win.isFullscreen !== 'function') return;
            const isFs = await win.isFullscreen();
            topBar.classList.toggle('topbar-fs', isFs);
          } catch (_) {
            // Tauri window API 不可用（如 E2E 测试环境），静默忽略
          }
        }
      
        // 初始检测
        updateFullscreenClass();
      
        // 监听窗口尺寸变化（进入/退出全屏会触发 resize）
        try {
          const tauriWindow = window.__TAURI__?.window;
          if (tauriWindow && tauriWindow.getCurrentWindow) {
            const win = tauriWindow.getCurrentWindow();
            if (win && typeof win.onResized === 'function') {
              win.onResized(() => updateFullscreenClass());
            }
          }
        } catch (_) {
          // 降级：仅初始检测一次，不监听后续变化
        }
      }

      /**
       * 应用启动入口：i18n 初始化 → Mermaid 初始化 → 预设渲染 → LLM 配置检查。
       */
      async function boot() {
        // i18n 初始化（必须在 UI 渲染前完成，确保所有文案就绪）
        await initI18n();
      
        // 防御性检查：等待 Tauri 运行时初始化完成
        if (!window.__TAURI__ || !window.__TAURI__.core || !window.__TAURI__.event) {
          console.warn('[EchoMind] Tauri runtime not ready, retrying boot() in 200ms…');
          setTimeout(boot, 200);
          return;
        }
      
        // 全屏检测：macOS 全屏时 traffic lights 消失，移除 78px padding 让按钮左移填补
        initFullscreenDetection();
      
        // ==text== 高亮标记扩展
        marked.use({
          extensions: [{
            name: 'highlight',
            level: 'inline',
            start(src) { return src.indexOf('=='); },
            tokenizer(src) {
              const match = /^==(?=\S)([\s\S]*?\S)==/.exec(src);
              if (match) return { type: 'highlight', raw: match[0], text: match[1] };
            },
            renderer(token) { return '<mark>' + token.text + '</mark>'; },
          }],
        });
        marked.setOptions({ breaks: true, gfm: true });
      
        // Mermaid 初始化
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'strict',
          fontFamily: 'inherit',
        });
      
        // 初始化各模块
        renderPresetCards();
        applyPreset();
        initWizard(initConversations);
        initSidebar();
      setReloadDocsCallback(loadDocuments);
        initSearchPopup(loadConversation);
        initCommandPalette(getCommands());
        initPaywall();
        initSettings();
        initDragDrop(async () => { await loadDocuments(); });
        initFilePicker(async () => { await loadDocuments(); });
        if ($('importCancelBtn')) initImportCancel();
        initConvNav();
        initContextMenu();
      
        // 初始化安全模块（同步加密状态、监听锁屏事件、绑定活动监听）
        initSecurity();
      
        // 包装 invoke 以集中处理导入错误（付费墙 / 格式错误）
        const _origInvoke = window.__TAURI__.core.invoke;
        window.__TAURI__.core.invoke = async function(cmd, args) {
          try {
            return await _origInvoke.call(this, cmd, args);
          } catch (err) {
            const msg = String(err);
            if (msg.includes('PRO_REQUIRED') || msg.includes('LIMIT_REACHED')) {
              showPaywall(msg.split(':').slice(1).join(':').trim() || t('paywall.reason_default'));
            } else if (msg.startsWith('不支持的格式') || msg.startsWith('Unsupported format')) {
              toastError(msg);
            }
            throw err;
          }
        };
      
        // 输入框事件
        $('sendBtn').onclick = send;
        $('stopBtn').onclick = onStop;
        $('newChatBtn').onclick = newChat;
        $('settingsBtn').onclick = () => openSettings();
      
        // 会话搜索弹框

        subscribe('isPro', () => { loadDocuments(); });
      
        // 输入框微交互

          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

          if (Math.abs(newHeight - prevHeight) > 2) {
            ta.style.height = newHeight + 'px';

          }
        });

          onNewChat: () => newChat(),
          onImport: () => $('plusBtn').click(),
          onSettings: () => openSettings(),
          onAbort: () => { if (get('streaming')) onStop(); },
          onCloseVlm: () => $('vlmConfirmCancel').click(),
          onClosePaywall: () => hidePaywall(),
          onCloseSettings: () => closeSettings(),
          onCloseSearchPopup: () => closeSearchPopup(),
        });
      
        // 注册对话流事件监听
        initChatEventListeners({
          onChatDone: async () => { setState({ isNewConversation: false }); await loadConversations(); },
          onDocStatusChanged: async () => { await loadDocuments(); },
          onImportProgress: (p) => {
            if (!p) { hideImportProgress(); return; }
            const percent = p.total > 0 ? Math.round((p.completed / p.total) * 100) : 0;
            $('importProgressBar').style.width = `${percent}%`;
            $('importProgressText').textContent = t('import.progress_importing', { done: p.completed, total: p.total, file: p.current_file });
          },
          onEmbeddingProgress: (p) => {
            const percent = p.total > 0 ? Math.round((p.embedded / p.total) * 100) : 0;
            $('importProgressBar').style.width = `${percent}%`;
            $('importProgressText').textContent = t('import.progress_vectorizing', { done: p.embedded, total: p.total, doc: p.doc_name });
          },
          onModelDownload: (p) => {
            if (p.downloading) {
              const pct = p.downloading.total > 0 ? Math.round((p.downloading.current / p.downloading.total) * 100) : 0;
              toast(t('settings.downloading_file', { file: p.downloading.file_name, pct: pct + '%' }), 'info');
            } else if (p.loading !== undefined) {
              toast(t('settings.building_onnx'), 'info');
            } else if (p.done) {
              toastSuccess(t('settings.model_downloaded'));
            }
          },
        });
      
        // 启动引导：检查 LLM 配置
        resetChatArea(t('chat.placeholder_title'), t('chat.placeholder_desc'));
      
        try {
          const settings = await invoke('get_settings');
          if (settings.has_llm_config) {
            setState({ isPro: await invoke('get_pro_status'), vlmEnabled: settings.vlm_enabled });
            updateProStatus();
            showApp();
            await initConversations();
          } else {
            showWizard();
          }
        } catch (_) {
          showWizard();
        }
      }
      
      // 启动
      boot();
    </script>
  </body>
</html>

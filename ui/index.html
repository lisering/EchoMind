<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoMind</title>
    <!-- 前端库全部本地化（PROJECT_RULES 体系三 / REQ-SEC-003：禁止运行时 CDN） -->
    <!-- Tailwind CSS 预构建（替代 vendor/tailwindcss.js 441KB JIT 运行时，441KB→35KB -92%） -->
    <link rel="stylesheet" href="vendor/tailwind-prebuilt.css" />
    <!-- 第三方库本地化（highlight/katex/chart/d3/mermaid 延迟加载，见 lazy-loader.js） -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <link rel="stylesheet" href="vendor/github-dark.min.css" />
    <!-- ============ EchoMind 样式（模块化拆分 / FIGMA_DESIGN_SPEC §2-§10） ============ -->
    <style data-src="tokens.css">
      /* ============================================================
       * EchoMind Design Token v2.0 — CSS 变量系统
       * FIGMA_DESIGN_SPEC §2 — 暗色主题
       *
       * 本文件仅保留基础设施：CSS 变量定义 + 基础重置 + 浏览器 Hack。
       * 所有组件样式使用 Tailwind 工具类（见 index.html <script> tailwind.config）。
       * 动画已注册到 Tailwind config keyframes/animation，使用 animate-* 类。
       * ============================================================ */
      
      :root {
        /* ============================================================
         * Color Tokens（颜色令牌）
         * ============================================================ */
      
        /* Surface 色阶（背景层次，受 Arc/Linear 启发） */
        --surface-0: #0A0A0B;
        --surface-1: #131316;
        --surface-2: #1C1C20;
        --surface-3: #26262C;
        --surface-4: #303036;
      
        /* Border 色阶 */
        --border-subtle: #1F1F23;
        --border-default: #2A2A2E;
        --border-strong: #3A3A40;
      
        /* Text 色阶 */
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-tertiary: #94A3B8;
        --text-quaternary: #8995A8;
      
        /* Accent */
        --accent: #38BDF8;
        --accent-hover: #0EA5E9;
        --accent-subtle: rgba(56, 189, 248, 0.08);
        --accent-rgb: 56, 189, 248;  /* rgba() 使用的 RGB 分量 */
        --accent-text: var(--accent);  /* 文本用 accent 色（暗色主题与 accent 一致） */
      
        /* Semantic */
        --success: #4ADE80;
        --warning: #FBBF24;
        --danger: #F87171;
        --info: #60A5FA;
        --ink: #0C1116;
      
        /* Semantic RGB 分量（rgba() 使用） */
        --success-rgb: 74, 222, 128;
        --warning-rgb: 251, 191, 36;
        --danger-rgb: 248, 113, 113;
        --info-rgb: 96, 165, 250;
      
        /* 语义扩展色（审计日志/PII 等特定场景） */
        --primary: #3B82F6;
        --primary-hover: #2563EB;
        --purple: #A855F7;
        --pink: #EC4899;
      
        /* ============================================================
         * Spacing Tokens（间距令牌）
         * 基于 4px 网格系统，便于整体调整
         * ============================================================ */
        --space-0: 0px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
      
        /* ============================================================
         * Message Tokens（消息组件令牌）
         * ============================================================ */
        /* 消息块 */
        --msg-padding: var(--space-4);           /* 16px */
        --msg-padding-sm: var(--space-3);        /* 12px */
        --msg-radius: 12px;
        --msg-gap-qa: var(--space-8);            /* 问答间距 32px */
        --msg-gap-inner: var(--space-1);         /* 消息内部间距 4px */
        --msg-list-max-width: 840px;            /* 消息列表最大宽度 — 居中阅读区（DeepSeek 风格） */
      
        /* 用户消息 */
        --msg-user-bg: rgba(56, 189, 248, 0.08);
        --msg-user-border: rgba(56, 189, 248, 0.12);
        --msg-user-max-width: calc(100% - 88px);  /* DeepSeek 实测值 */
        --msg-user-radius: 22px;                 /* 用户气泡大圆角（DeepSeek 风格） */
      
        /* 助手消息 — 透明背景，无气泡（DeepSeek 风格） */
        --msg-assistant-bg: transparent;
        --msg-assistant-border: transparent;
      
        /* 操作栏 */
        --action-gap: var(--space-1);            /* 4px */
        --action-btn-size: 28px;                 /* 按钮尺寸 */
        --action-opacity: 0;                     /* 默认隐藏 */
        --action-opacity-hover: 1;               /* 悬停显示 */
        --action-transition: opacity 0.15s ease;
      
        /* ============================================================
         * 语义别名（Bg 别名 — 统一引用 Surface 色阶）
         * ============================================================ */
        --bg-primary: var(--surface-1);    /* 模态框/卡片背景 */
        --bg-secondary: var(--surface-2); /* 次级背景 */
        --bg-hover: var(--surface-3);     /* 悬停态背景 */
        --bg-input: var(--surface-0);     /* 输入框背景 */
      
        /* ============================================================
         * Typography Tokens（排版令牌）
         * ============================================================ */
        --text-xs: 11px;
        --text-sm: 12px;
        --text-base: 16px;
        --text-lg: 18px;
        --leading-tight: 1.4;
        --leading-normal: 1.75;
      
        /* ============================================================
         * Transition Tokens（动效令牌 — REQ-DS-006）
         * ============================================================ */
        --duration-micro: 100ms;     /* 微交互（按钮按下、选中色变化） */
        --duration-fast: 150ms;      /* 快速过渡（hover、focus、copy-btn） */
        --duration-normal: 250ms;    /* 常规过渡（fade-in、modal 打开） */
        --duration-slow: 400ms;      /* 慢速过渡（侧栏折叠、大型面板展开） */
        --ease-out: ease-out;        /* 默认缓出 */
        --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);  /* Material Design 标准缓动 */
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* 弹簧缓动（scale-in、slide-up） */
      
        /* ============================================================
         * Hover Tokens（悬停反馈令牌 — REQ-IX-004）
         * ============================================================ */
        --hover-bg: var(--surface-3);                        /* 悬停背景色 */
        --hover-bg-subtle: rgba(255, 255, 255, 0.05);       /* 微亮悬停背景（列表项） */
        --hover-color: var(--accent);                        /* 悬停文字色 */
        --hover-transition: var(--duration-fast) var(--ease-out);  /* 悬停过渡简写 */
        --hover-opacity: 0.9;                               /* 悬停透明度（sendBtn） */
      
        /* ============================================================
         * Radius Tokens（圆角令牌 — REQ-DS-007）
         * ============================================================ */
        --radius-none: 0px;
        --radius-sm: 4px;           /* .copy-btn / .code-lang / 文档徽标 */
        --radius-md: 8px;           /* 代码块 pre / .md details */
        --radius-lg: 12px;          /* 按钮 / 输入框 / Toast / 信息卡片 */
        --radius-xl: 16px;          /* assistant Block / user Block / #inputBar */
        --radius-2xl: 24px;         /* 拖拽遮罩虚线框 */
        --radius-full: 9999px;      /* #vlmToggle / 引用芯片 / 进度条 / 圆点 */
      
        /* ============================================================
         * Shadow Tokens（阴影令牌 — REQ-DS-007）
         * ============================================================ */
        --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.15);       /* Toast 单条 */
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);       /* 右键菜单 / 浮动按钮 */
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);       /* 大型模态框 */
        --shadow-focus: 0 0 0 2px var(--surface-0), 0 0 0 4px var(--accent);  /* Focus 环 */
      
        /* ============================================================
         * Layer 2: Semantic Aliases（语义别名层 — DeepSeek 风格三层架构）
         *
         * 引用 Layer 1 原始变量，为组件层提供语义化间接引用。
         * 主题切换时只需修改此层，无需逐组件修改。
         * ============================================================ */
        --dsw-alias-brand-primary: var(--accent);
        --dsw-alias-brand-hover: var(--accent-hover);
        --dsw-alias-brand-subtle: var(--accent-subtle);
        --dsw-alias-brand-rgb: var(--accent-rgb);
      
        --dsw-alias-label-primary: var(--text-primary);
        --dsw-alias-label-secondary: var(--text-secondary);
        --dsw-alias-label-tertiary: var(--text-tertiary);
        --dsw-alias-label-caption: var(--text-quaternary);
      
        --dsw-alias-surface-0: var(--surface-0);
        --dsw-alias-surface-1: var(--surface-1);
        --dsw-alias-surface-2: var(--surface-2);
        --dsw-alias-surface-3: var(--surface-3);
      
        --dsw-alias-interactive-bg-hover: var(--surface-3);
        --dsw-alias-interactive-bg-selected: rgba(var(--accent-rgb), 0.15);
      
        --dsw-alias-border-l1: var(--border-subtle);
        --dsw-alias-border-l2: var(--border-default);
        --dsw-alias-border-l3: var(--border-strong);
      
        --dsw-alias-success: var(--success);
        --dsw-alias-warning: var(--warning);
        --dsw-alias-danger: var(--danger);
        --dsw-alias-info: var(--info);
      
        /* ============================================================
         * Layer 3: Component Variables（组件变量层 — DeepSeek 风格三层架构）
         *
         * 引用 Layer 2 语义别名，为特定组件提供命名变量。
         * 组件样式引用此层变量，实现组件级主题定制。
         * ============================================================ */
      
        /* Button 组件 */
        --dsl-button-radius: 4096px;       /* 胶囊形按钮 */
        --dsl-button-radius-sm: 8px;       /* 小按钮 */
        --dsl-button-text: var(--dsw-alias-label-primary);
        --dsl-button-bg: transparent;
        --dsl-button-bg-hover: var(--dsw-alias-interactive-bg-hover);
        --dsl-button-ring: var(--dsw-alias-brand-primary);
      
        /* Input 组件 */
        --dsl-input-radius: 16px;
        --dsl-input-bg: var(--dsw-alias-surface-2);
        --dsl-input-border: var(--dsw-alias-border-l2);
        --dsl-input-border-focus: rgba(var(--dsw-alias-brand-rgb), 0.6);
      
        /* Message 组件 */
        --dsl-msg-user-radius: var(--msg-user-radius);
        --dsl-msg-user-bg: var(--msg-user-bg);
        --dsl-msg-user-border: var(--msg-user-border);
        --dsl-msg-assistant-bg: var(--msg-assistant-bg);
        --dsl-msg-list-max-width: var(--msg-list-max-width);
      
        /* Card 组件 */
        --dsl-card-radius: 12px;
        --dsl-card-bg: var(--dsw-alias-surface-2);
        --dsl-card-border: var(--dsw-alias-border-l2);
      
        /* Toggle 组件 */
        --dsl-toggle-radius: 8px;
        --dsl-toggle-active-text: var(--dsw-alias-brand-primary);
        --dsl-toggle-active-bg: rgba(var(--dsw-alias-brand-rgb), 0.1);
        --dsl-toggle-inactive-text: var(--dsw-alias-label-tertiary);
      
        /* Thinking Panel 组件 */
        --dsl-thinking-text: var(--dsw-alias-label-tertiary);
        --dsl-thinking-content-border: var(--dsw-alias-border-l1);
      
        /* ============================================================
         * Animation Component Tokens（组件动效令牌 — REQ-DS-006）
         * ============================================================ */
        --anim-modal: scaleIn var(--duration-normal) var(--ease-out);     /* 模态框打开 */
        --anim-toast: toastIn var(--duration-normal) var(--ease-out);     /* Toast 滑入 */
        --anim-panel: panelIn var(--duration-fast) var(--ease-out);       /* 面板打开 */
        --anim-message: messageIn var(--duration-normal) var(--ease-out); /* 消息出现 */
      }
      
      /* ============================================================
       * Light Theme — [data-theme="light"] 变量覆盖（REQ-UI-011）
       *
       * 通过 CSS 变量覆盖实现浅色主题，零组件代码改动。
       * 所有颜色变量在此重新定义，Spacing/Typography/Transition 等非颜色变量
       * 继承 :root 默认值，无需重复声明。
       * ============================================================ */
      
      [data-theme="light"] {
        /* Surface 色阶（浅色主题背景层次） */
        --surface-0: #FFFFFF;    /* 主背景白 */
        --surface-1: #F8FAFC;    /* 次背景，slate-50 */
        --surface-2: #F1F5F9;    /* 卡片背景，slate-100 */
        --surface-3: #E2E8F0;    /* 悬停态，slate-200 */
        --surface-4: #CBD5E1;    /* 选中态，slate-300 */
      
        /* Border 色阶 */
        --border-subtle: #E2E8F0;   /* slate-200 */
        --border-default: #CBD5E1;  /* slate-300 */
        --border-strong: #94A3B8;   /* slate-400 */
      
        /* Text 色阶（确保 WCAG AA 4.5:1，包括在 surface-3 背景上） */
        --text-primary: #0F172A;     /* slate-900，在 #FFFFFF 上 18.7:1 */
        --text-secondary: #334155;   /* slate-700，在 #FFFFFF 上 12.6:1 */
        --text-tertiary: #475569;    /* slate-600，在 #FFFFFF 上 7.6:1 */
        --text-quaternary: #475569;  /* slate-600，在 surface-3 (#E2E8F0) 上 6.2:1（REQ-UI-011 AC-5） */
      
        /* Accent（保持品牌色一致，微调对比度） */
        --accent: #0EA5E9;            /* sky-500 */
        --accent-hover: #0284C7;      /* sky-600 */
        --accent-subtle: rgba(14, 165, 233, 0.08);
        --accent-rgb: 14, 165, 233;
        --accent-text: #0369A1;       /* sky-700，用于文本（在白色上 6.4:1，REQ-UI-011 AC-5） */
      
        /* Semantic */
        --success: #15803D;   /* green-700，在浅色背景上 5.2:1（REQ-UI-011 AC-5） */
        --warning: #D97706;   /* amber-600 */
        --danger: #DC2626;    /* red-600 */
        --info: #2563EB;      /* blue-600 */
        --ink: #F8FAFC;       /* 浅色主题下 ink 反转为浅色，用于深色背景上的文字 */
      
        /* Semantic RGB 分量 */
        --success-rgb: 22, 163, 74;
        --warning-rgb: 217, 119, 6;
        --danger-rgb: 220, 38, 38;
        --info-rgb: 37, 99, 235;
      
        /* 语义扩展色 */
        --primary: #2563EB;
        --primary-hover: #1D4ED8;
        --purple: #9333EA;
        --pink: #DB2777;
      
        /* Bg 别名（引用新的 Surface 色阶） */
        --bg-primary: var(--surface-1);
        --bg-secondary: var(--surface-2);
        --bg-hover: var(--surface-3);
        --bg-input: var(--surface-0);
      
        /* 消息组件令牌 */
        --msg-user-bg: rgba(14, 165, 233, 0.08);
        --msg-user-border: rgba(14, 165, 233, 0.15);
      
        /* Hover Tokens 覆盖（REQ-IX-004 浅色主题） */
        --hover-bg-subtle: rgba(0, 0, 0, 0.05);
      }
      
      [data-theme="light"] body {
        color-scheme: light;  /* 浅色主题：浏览器原生控件使用浅色 */
      }
      
      /* ============================================================
       * System Theme — [data-theme="system"] 跟随系统偏好（REQ-UI-011 AC-4）
       *
       * 当 data-theme="system" 时，根据 prefers-color-scheme 自动选择暗色或浅色。
       * 暗色为 :root 默认值（无需额外规则），浅色通过 @media 覆盖。
       * ============================================================ */
      
      @media (prefers-color-scheme: light) {
        [data-theme="system"] {
          /* Surface 色阶 */
          --surface-0: #FFFFFF;
          --surface-1: #F8FAFC;
          --surface-2: #F1F5F9;
          --surface-3: #E2E8F0;
          --surface-4: #CBD5E1;
      
          /* Border 色阶 */
          --border-subtle: #E2E8F0;
          --border-default: #CBD5E1;
          --border-strong: #94A3B8;
      
          /* Text 色阶 */
          --text-primary: #0F172A;
          --text-secondary: #334155;
          --text-tertiary: #475569;
          --text-quaternary: #475569;  /* REQ-UI-011 AC-5：确保在 surface-3 上 ≥ 4.5:1 */
      
          /* Accent */
          --accent: #0EA5E9;
          --accent-hover: #0284C7;
          --accent-subtle: rgba(14, 165, 233, 0.08);
          --accent-rgb: 14, 165, 233;
          --accent-text: #0369A1;  /* REQ-UI-011 AC-5 */
      
          /* Semantic */
          --success: #15803D;  /* REQ-UI-011 AC-5 */
          --warning: #D97706;
          --danger: #DC2626;
          --info: #2563EB;
          --ink: #F8FAFC;
      
          /* Semantic RGB 分量 */
          --success-rgb: 22, 163, 74;
          --warning-rgb: 217, 119, 6;
          --danger-rgb: 220, 38, 38;
          --info-rgb: 37, 99, 235;
      
          /* 语义扩展色 */
          --primary: #2563EB;
          --primary-hover: #1D4ED8;
          --purple: #9333EA;
          --pink: #DB2777;
      
          /* Bg 别名 */
          --bg-primary: var(--surface-1);
          --bg-secondary: var(--surface-2);
          --bg-hover: var(--surface-3);
          --bg-input: var(--surface-0);
      
          /* 消息组件令牌 */
          --msg-user-bg: rgba(14, 165, 233, 0.08);
          --msg-user-border: rgba(14, 165, 233, 0.15);
        }
      
        [data-theme="system"] body {
          color-scheme: light;
        }
      }
      
      /* ============================================================
       * High Contrast Theme — [data-theme="high-contrast"] 变量覆盖（REQ-A11Y-005）
       *
       * 基于暗色主题，提升对比度至 WCAG AAA（≥7:1），加粗边框，禁用半透明。
       * 适用于视力辅助需求用户，尊重 prefers-contrast: more 系统设置。
       * ============================================================ */
      
      [data-theme="high-contrast"] {
        /* Surface 色阶 — 纯黑/纯白对比 */
        --surface-0: #000000;      /* 主背景纯黑 */
        --surface-1: #0A0A0A;      /* 次背景 */
        --surface-2: #141414;      /* 卡片背景 */
        --surface-3: #1E1E1E;      /* 悬停态 */
        --surface-4: #282828;      /* 选中态 */
      
        /* Border 色阶 — 加粗至 2px（通过 --border-width 变量）+ 高对比色 */
        --border-subtle: #444444;
        --border-default: #666666;
        --border-strong: #FFFFFF;   /* 强边框使用纯白 */
      
        /* Text 色阶 — 全部纯白/亮黄确保 AAA 对比度 */
        --text-primary: #FFFFFF;    /* 纯白在 #000000 上 21:1 */
        --text-secondary: #F0F0F0;   /* 在 #000000 上 19.8:1 */
        --text-tertiary: #CCCCCC;    /* 在 #000000 上 13.9:1 */
        --text-quaternary: #AAAAAA;  /* 在 #000000 上 11.5:1 */
      
        /* Accent — 亮黄确保高对比度 */
        --accent: #FFFF00;            /* 亮黄，在黑色上 19.6:1 */
        --accent-hover: #FFE500;
        --accent-subtle: rgba(255, 255, 0, 0.15);  /* 半透明禁用，改用纯色 */
        --accent-rgb: 255, 255, 0;
        --accent-text: #FFFF00;
      
        /* Semantic — 高对比度版本 */
        --success: #00FF00;           /* 亮绿，在黑色上 15.3:1 */
        --warning: #FFAA00;           /* 亮橙 */
        --danger: #FF4444;            /* 亮红 */
        --info: #44AAFF;              /* 亮蓝 */
        --ink: #000000;
      
        /* Semantic RGB 分量 */
        --success-rgb: 0, 255, 0;
        --warning-rgb: 255, 170, 0;
        --danger-rgb: 255, 68, 68;
        --info-rgb: 68, 170, 255;
      
        /* 语义扩展色 */
        --primary: #44AAFF;
        --primary-hover: #2299FF;
        --purple: #BB44FF;
        --pink: #FF44BB;
      
        /* Bg 别名 */
        --bg-primary: var(--surface-1);
        --bg-secondary: var(--surface-2);
        --bg-hover: var(--surface-3);
        --bg-input: var(--surface-0);
      
        /* 消息组件令牌 — 禁用半透明，改用纯色边框 */
        --msg-user-bg: #0A0A0A;                          /* 纯色替代半透明 */
        --msg-user-border: #FFFF00;                      /* 亮黄边框替代半透明 */
        --msg-assistant-bg: transparent;
        --msg-assistant-border: transparent;
      
        /* Hover Tokens 覆盖 — 禁用半透明 */
        --hover-bg: var(--surface-3);
        --hover-bg-subtle: #1A1A1A;                      /* 纯色替代半透明 */
      
        /* Shadow — 高对比度模式禁用阴影，改用边框 */
        --shadow-sm: 0 0 0 1px var(--border-strong);
        --shadow-md: 0 0 0 2px var(--border-strong);
        --shadow-lg: 0 0 0 2px var(--border-strong);
        --shadow-focus: 0 0 0 2px var(--surface-0), 0 0 0 4px var(--accent);
      
        /* Focus 环 — 加粗至 4px */
        /* --shadow-focus 已通过变量覆盖，无需额外规则 */
      }
      
      [data-theme="high-contrast"] body {
        color-scheme: dark;
      }
      
      /* 高对比度模式：边框加粗至 2px（AC-1） */
      [data-theme="high-contrast"] .border,
      [data-theme="high-contrast"] .border-t,
      [data-theme="high-contrast"] .border-b,
      [data-theme="high-contrast"] .border-l,

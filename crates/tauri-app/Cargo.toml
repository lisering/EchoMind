[package]
name = "echomind-tauri-app"
version = "0.1.0"
edition = "2024"
description = "EchoMind Tauri 组装层：依赖注入、Command/Event 声明与错误码映射"

[dependencies]
echomind-core = { path = "../core" }
echomind-infra = { path = "../infra" }
echomind-models = { path = "../models" }
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
futures = "0.3"
serde_json = "1.0"

# generate_context! 宏依赖构建脚本提供 OUT_DIR（tauri-build 与 tauri 主版本对齐）
[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tauri = { version = "2.0", features = ["test"] }
tempfile = "3"

[lints]
workspace = true

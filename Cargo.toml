# EchoMind（灵犀）Workspace 底座
# 依赖方向铁律（PROJECT_RULES.md 体系三）：crates/tauri-app → crates/core → crates/models，严禁反向
[workspace]
resolver = "3"
members = [
    "crates/models",
    "crates/prompt",
    "crates/compact",
    "crates/context",
    "crates/core",
    "crates/infra",
    "crates/tauri-app",
]

# 体系三铁律五：生产代码严禁 unwrap() / expect() / panic!() / unreachable!() / todo!() / unimplemented!()
# CI 以 clippy deny lint 全覆盖强制（测试代码通过 #![allow(...)] 豁免）
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

# DevOps 基线：dev 模式下全部依赖 crate 以 opt-level 3 编译，避免重型计算库拖慢调试体验
[profile.dev.package."*"]
opt-level = 3

# REQ-NFR-019 构建产物体积优化：Release 模式启用 Fat LTO + 符号剥离 + 单 codegen-unit + panic=abort
# 减小二进制体积（macOS .dmg ≤ 50MB / Windows .msi ≤ 60MB，不含 ONNX 模型）
# panic=abort 移除 unwinding 机制（~200-500KB），桌面 GUI 无需 unwind 恢复
[profile.release]
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
